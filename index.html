  // 언젠가 행을 다가오는 계획의 특정 날짜/오늘(타임블럭·타임라인·하루종일)로 드래그하면
  // tok_someday에서 지우고 tok_todos에 그 조건으로 새로 만듦(moveItemToZone의 someday 분기).
  function attachSomedayDrag() {
    document.querySelectorAll(".ag-someday-row[data-someday-id]").forEach(row => {
      let moved = false, startX = 0, startY = 0, curTarget = null;
      row.addEventListener("pointerdown", (e) => {
        if (e.target.closest("input")) return;
        moved = false; curTarget = null;
        startX = e.clientX; startY = e.clientY;
        row.setPointerCapture?.(e.pointerId);
      });
      row.addEventListener("pointermove", (e) => {
        if (!row.hasPointerCapture?.(e.pointerId)) return;
        if (!moved && Math.hypot(e.clientX - startX, e.clientY - startY) > 8) {
          moved = true;
          row.classList.add("dragging");
        }
        if (!moved) return;
        const under = document.elementFromPoint(e.clientX, e.clientY)?.closest(".ag-block-card[data-block-start], .ag-tl-grid, #agendaAllDayZone, .planup-day[data-idx]");
        if (under !== curTarget) {
          curTarget?.classList.remove("drop-target");
          curTarget = under || null;
          curTarget?.classList.add("drop-target");
        }
      });
      const finish = async (e) => {
        if (!row.hasPointerCapture?.(e.pointerId)) return;
        const wasMoved = moved, id = row.dataset.somedayId;
        moved = false;
        row.classList.remove("dragging");
        curTarget?.classList.remove("drop-target");
        curTarget = null;
        if (!wasMoved) return;
        const drop = homeDropZone(e.clientX, e.clientY);
        if (!drop || drop.zone === "someday") return; // 이미 언젠가라 놓아도 변화 없음
        await moveItemToZone("someday", id, drop);
      };
      row.addEventListener("pointerup", finish);
      row.addEventListener("pointercancel", () => {
        moved = false;
        row.classList.remove("dragging");
        curTarget?.classList.remove("drop-target");
        curTarget = null;
      });
    });
  }

  // ── 할일 탭: 다가오는 계획 보드 + 언젠가 할일 관리 ──
  function renderTodosPage() {
    renderPlanBoard();
    renderSomeday();
  }

  // 시간이 있는 습관 / 없는 습관으로만 나눔 (시간블럭 개념은 더 이상 화면에 표시하지 않음)
  function splitByTime(active) {
    const timed = active.filter(t => t.start_minute != null).sort((a, b) => a.start_minute - b.start_minute);
    const untimed = active.filter(t => t.start_minute == null);
    return { timed, untimed };
  }

  function untimedListHtml(untimed, label) {
    if (!untimed.length) return "";
    return `
      <div class="tl-unassigned">
        <div class="section-label">${escapeHtml(label)}</div>
        <div class="card">
          ${untimed.map(t => {
            const done = logsToday.has(t.id);
            return `<div class="task-row ${done?'done':''}">
              <input type="checkbox" ${done?"checked":""} data-id="${t.id}" class="home-check" />
              <span>${escapeHtml(t.name)}</span>
            </div>`;
          }).join("")}
        </div>
      </div>`;
  }

  function timedRowHtml(t) {
    const done = logsToday.has(t.id);
    return `<div class="task-row ${done?'done':''}" data-id="${t.id}">
      <input type="checkbox" ${done?"checked":""} data-id="${t.id}" class="home-check" />
      <span style="color:var(--sub);font-size:12px;margin-right:6px;">${minutesToHHMM(t.start_minute)}</span>
      <span>${escapeHtml(t.name)}</span>
    </div>`;
  }

  // 타임블럭 보기: tok_time_blocks의 이름표(아침/오전/오후/저녁/밤 등) 구간에 맞춰
  // 시간이 있는 습관을 그룹핑해서 보여줌. block_id 컬럼은 더이상 쓰지 않고,
  // start_minute이 어느 블럭 구간에 들어가는지로 매번 다시 계산함.
  function renderHomeBlocks(active) {
    const { timed, untimed } = splitByTime(active);
    let html = "";

    if (timeBlocks.length) {
      const covered = new Set();
      timeBlocks.forEach(block => {
        const inBlock = timed.filter(t => t.start_minute >= block.start_minute && t.start_minute < block.end_minute);
        inBlock.forEach(t => covered.add(t.id));
        html += `<div class="section-label" style="margin:14px 2px 8px;">${escapeHtml(block.title)}</div>`;
        html += `<div class="card" data-block-start="${block.start_minute}">${inBlock.map(timedRowHtml).join("")}<div class="block-add-row" data-block-start="${block.start_minute}">+ 추가</div></div>`;
      });
      const uncovered = timed.filter(t => !covered.has(t.id));
      if (uncovered.length) {
        html += `<div class="card">${uncovered.map(timedRowHtml).join("")}</div>`;
      }
    } else if (timed.length) {
      // 타임블럭이 하나도 설정 안 돼있으면 그냥 시간순으로만 보여줌
      html += `<div class="card">${timed.map(timedRowHtml).join("")}</div>`;
    }

    $("timelineWrap").innerHTML = html + untimedListHtml(untimed, "시간 없음");

    // 블럭 안 "+ 추가"를 누르면 팝업 없이 바로 그 자리에서 입력할 수 있게 인라인 입력창으로 바뀜.
    // 시작 시각은 블럭 시작시각, 소요시간은 기본 30분(습관 관리 화면에서 나중에 15분 단위로 조절 가능)
    document.querySelectorAll(".block-add-row").forEach(row => {
      row.onclick = () => {
        const startMinute = parseInt(row.dataset.blockStart, 10);
        const wrap = document.createElement("div");
        wrap.className = "block-add-row";
        wrap.innerHTML = `<input type="text" class="inline-add-input" placeholder="습관 이름" />`;
        row.replaceWith(wrap);
        const input = wrap.querySelector("input");
        input.focus();
        let done = false;
        const commit = async () => {
          if (done) return;
          const name = input.value.trim();
          if (!name) { renderHome(); return; }
          done = true;
          const { error } = await sb.from("tok_habits").insert({ name, sort_order: tasks.length, start_minute: startMinute, duration_minutes: 30, repeat_unit: "day", repeat_interval: 1 });
          if (error) { alert("저장 실패: " + error.message); done = false; return; }
          await loadAll();
        };
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); commit(); }
          else if (e.key === "Escape") { done = true; renderHome(); }
        });
        input.addEventListener("blur", commit);
      };
    });

    attachBlockDrag();
  }

  // 타임블럭(목록) 보기: 습관 행을 다른 블럭 카드 위로 드래그해서 옮기면
  // 그 블럭의 시작시각으로 재배정됨(소요시간은 그대로 유지). 짧게 누르기만 하면 아무 것도 안 함
  // (체크박스는 기존과 동일하게 그대로 동작).
  function attachBlockDrag() {
    let dragEl = null, dragId = null, moved = false, startX = 0, startY = 0, curTarget = null;

    document.querySelectorAll(".task-row[data-id]").forEach(row => {
      row.addEventListener("pointerdown", (e) => {
        if (e.target.closest("input")) return;
        dragEl = row; dragId = row.dataset.id; moved = false; curTarget = null;
        startX = e.clientX; startY = e.clientY;
        row.setPointerCapture?.(e.pointerId);
      });
      row.addEventListener("pointermove", (e) => {
        if (!dragEl) return;
        if (!moved && Math.hypot(e.clientX - startX, e.clientY - startY) > 8) {
          moved = true;
          dragEl.classList.add("dragging");
        }
        if (!moved) return;
        const under = document.elementFromPoint(e.clientX, e.clientY)?.closest(".card[data-block-start]");
        if (under !== curTarget) {
          curTarget?.classList.remove("drop-target");
          curTarget = under || null;
          curTarget?.classList.add("drop-target");
        }
      });
      const finish = async () => {
        if (!dragEl) return;
        const el = dragEl, id = dragId, wasMoved = moved, target = curTarget;
        dragEl = null; dragId = null; moved = false; curTarget = null;
        el.classList.remove("dragging");
        target?.classList.remove("drop-target");
        if (!wasMoved || !target) return; // 다른 블럭 위에서 놓지 않았으면 그대로 둠
        const startMinute = parseInt(target.dataset.blockStart, 10);
        const { error } = await sb.from("tok_habits").update({ start_minute: startMinute }).eq("id", id);
        if (error) { alert("이동 실패: " + error.message); return; }
        await loadAll();
      };
      row.addEventListener("pointerup", finish);
      row.addEventListener("pointercancel", () => {
        dragEl?.classList.remove("dragging");
        curTarget?.classList.remove("drop-target");
        dragEl = null; dragId = null; moved = false; curTarget = null;
      });
    });
  }

  // 타임라인 보기: 15분 단위 그리드 위에 습관을 시작 시각·소요시간에 맞춰 배치.
  // 시간블럭 배경 띠는 더 이상 표시하지 않음 — 빈칸을 클릭/드래그하면 그 시각에 바로 습관을 추가할 수 있음.
  const TL_SLOT_MIN = 15;
  const TL_ROW_PX = 13;
  let tlAddState = null;

  function renderHomeTimeline(active) {
    const { timed, untimed } = splitByTime(active);

    let minM = 360, maxM = 1440; // 기본 06:00~24:00
    timed.forEach(t => {
      minM = Math.min(minM, t.start_minute);
      maxM = Math.max(maxM, t.start_minute + (t.duration_minutes || 30));
    });

    const slotCount = Math.max(1, Math.ceil((maxM - minM) / TL_SLOT_MIN));
    const rowOf = (m) => Math.floor((m - minM) / TL_SLOT_MIN) + 1;

    let rowsHtml = "";
    for (let i = 0; i < slotCount; i++) {
      const m = minM + i * TL_SLOT_MIN;
      if (m % 30 === 0) {
        rowsHtml += `<div class="tl-row-line" style="grid-row:${i+1}"></div>`;
        // 30분 눈금선은 다 그리되, 숫자 표시는 정시(매 60분)에만 — 30분 지점은 눈금만 봐도 알 수 있음
        if (m % 60 === 0) {
          rowsHtml += `<div class="tl-row-label" style="grid-row:${i+1}">${minutesToHHMM(m)}</div>`;
        }
      }
    }

    let tasksHtml = "";
    timed.forEach(t => {
      const duration = t.duration_minutes || 30;
      const tStartRow = rowOf(t.start_minute);
      const tEndRow = Math.max(tStartRow + 1, rowOf(t.start_minute + duration));
      const done = logsToday.has(t.id);
      tasksHtml += `<div class="tl-task ${done?'done':''}" data-id="${t.id}" data-start="${t.start_minute}" data-duration="${duration}" style="grid-row:${tStartRow} / ${tEndRow}">
        <input type="checkbox" ${done?"checked":""} data-id="${t.id}" class="home-check" />
        <span class="tl-title">${escapeHtml(t.name)}</span>
      </div>`;
    });

    $("timelineWrap").innerHTML = `<div class="tl-grid" id="tlGrid" style="grid-template-rows:repeat(${slotCount},${TL_ROW_PX}px)">${rowsHtml}${tasksHtml}</div>${untimedListHtml(untimed, "시간 없음")}`;
    attachTimelineAddDrag(minM, slotCount);
    attachTimelineItemDrag(minM);
  }

  // 기존 습관 항목 인터랙션(2026-09-05 재설계):
  // - 몸통 전체(위/아래 끝 8px 포함) 짧게 클릭 → 이름 인라인 수정
  // - 몸통 아무 곳이나 0.3초 이상 누르고 있다가 움직이면 → 이동(시작시각 변경)
  // - 단, 위/아래 끝 8px 구역에서는 누르자마자(0.3초 기다리지 않고) 바로 드래그하면 → 시간 조절(resize).
  //   같은 구역이라도 눌러서 0.3초 넘게 가만히 있으면 그 뒤엔 이동으로 취급.
  // - 그 외 몸통에서 0.3초 되기 전에 움직이면(스크롤 등으로 보고) 취소, 아무 것도 안 함.
  const TL_LONG_PRESS_MS = 300;
  const TL_EDGE_ZONE_PX = 8;

  function attachTimelineItemDrag(minM) {
    const rowOf = (m) => Math.floor((m - minM) / TL_SLOT_MIN) + 1;

    document.querySelectorAll(".tl-task").forEach(task => {
      const id = task.dataset.id;
      if (!id) return; // 인라인 추가 중인 임시 요소는 건너뜀
      const origStart = parseInt(task.dataset.start, 10);
      const origDuration = parseInt(task.dataset.duration, 10);

      let dragKind = null; // null(대기중) | "move" | "resize-top" | "resize-bottom"
      let startY = 0, moved = false, cancelled = false, pressed = false, edgeAtStart = null;
      let longPressTimer = null;
      let pendingStart = origStart, pendingDuration = origDuration;

      const zoneAt = (clientY) => {
        const rect = task.getBoundingClientRect();
        const offsetY = clientY - rect.top;
        if (offsetY <= TL_EDGE_ZONE_PX) return "top";
        if (offsetY >= rect.height - TL_EDGE_ZONE_PX) return "bottom";
        return null;
      };

      const applyPreview = () => {
        const sRow = rowOf(pendingStart), eRow = Math.max(sRow + 1, rowOf(pendingStart + pendingDuration));
        task.style.gridRow = `${sRow} / ${eRow}`;
      };
      const clearTimer = () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } };
      const clearHoverHint = () => { task.classList.remove("edge-hover-top", "edge-hover-bottom"); task.style.cursor = ""; };

      const startEditTitle = () => {
        const titleEl = task.querySelector(".tl-title");
        if (!titleEl) return;
        const current = titleEl.textContent;
        const input = document.createElement("input");
        input.type = "text";
        input.className = "inline-add-input";
        input.value = current;
        titleEl.replaceWith(input);
        input.focus(); input.select();
        let done = false;
        const commit = async () => {
          if (done) return;
          const name = input.value.trim();
          if (!name || name === current) { renderHome(); return; }
          done = true;
          const { error } = await sb.from("tok_habits").update({ name }).eq("id", id);
          if (error) { alert("수정 실패: " + error.message); done = false; return; }
          await loadAll();
        };
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); commit(); }
          else if (e.key === "Escape") { done = true; renderHome(); }
        });
        input.addEventListener("blur", commit);
      };

      task.addEventListener("pointerdown", (e) => {
        if (e.target.closest("input")) return;
        pressed = true;
        moved = false; cancelled = false;
        pendingStart = origStart; pendingDuration = origDuration;
        startY = e.clientY;
        edgeAtStart = zoneAt(e.clientY);
        dragKind = null;
        task.setPointerCapture?.(e.pointerId);

        // 몸통 어디든(끝 8px 포함) 일단 0.3초 대기 → 그동안 안 움직이면 이동으로 전환
        longPressTimer = setTimeout(() => {
          longPressTimer = null;
          if (cancelled) return;
          dragKind = "move";
          task.classList.add("dragging");
          clearHoverHint();
        }, TL_LONG_PRESS_MS);
      });
      task.addEventListener("pointermove", (e) => {
        if (!pressed) {
          // 누르지 않은 상태(호버)에서는 끝 8px 구역이면 조절 커서/표시만 보여줌
          const zone = zoneAt(e.clientY);
          task.classList.toggle("edge-hover-top", zone === "top");
          task.classList.toggle("edge-hover-bottom", zone === "bottom");
          task.style.cursor = zone ? "ns-resize" : "";
          return;
        }
        const dy = e.clientY - startY;
        if (dragKind === null) {
          if (cancelled) return;
          if (Math.abs(dy) > 6) {
            clearTimer();
            if (edgeAtStart) {
              // 끝 구역에서 0.3초 기다리지 않고 바로 드래그 → 시간 조절
              dragKind = edgeAtStart === "top" ? "resize-top" : "resize-bottom";
            } else {
              // 몸통 가운데에서 기다리지 않고 바로 움직이면 스크롤 등으로 보고 취소
              cancelled = true;
              return;
            }
          } else {
            return;
          }
        }
        if (Math.abs(dy) > 6) moved = true;
        if (!moved) return;
        const deltaMin = Math.round(dy / TL_ROW_PX) * TL_SLOT_MIN;
        if (dragKind === "move") {
          let ns = origStart + deltaMin;
          ns = Math.max(0, Math.min(1440 - origDuration, ns));
          pendingStart = ns; pendingDuration = origDuration;
        } else if (dragKind === "resize-top") {
          let ns = Math.max(0, Math.min(origStart + origDuration - TL_SLOT_MIN, origStart + deltaMin));
          pendingStart = ns; pendingDuration = (origStart + origDuration) - ns;
        } else {
          let nd = Math.max(TL_SLOT_MIN, Math.min(1440 - origStart, origDuration + deltaMin));
          pendingStart = origStart; pendingDuration = nd;
        }
        applyPreview();
      });
      const finish = async () => {
        clearTimer();
        pressed = false;
        const kind = dragKind;
        dragKind = null;
        task.classList.remove("dragging");
        clearHoverHint();

        if (kind === null) {
          if (!cancelled) startEditTitle(); // 0.3초 되기 전에 짧게 뗐으면 → 이름 수정
          return;
        }
        if (!moved) return; // 누르기만 하고 움직이지 않았으면 아무 것도 안 함
        const { error } = await sb.from("tok_habits").update({
          start_minute: pendingStart, duration_minutes: pendingDuration,
        }).eq("id", id);
        if (error) { alert((kind === "move" ? "이동" : "시간 조절") + " 실패: " + error.message); }
        await loadAll();
      };
      task.addEventListener("pointerup", finish);
      task.addEventListener("pointercancel", () => { clearTimer(); pressed = false; dragKind = null; task.classList.remove("dragging"); clearHoverHint(); });
      task.addEventListener("pointerleave", () => { if (!pressed) clearHoverHint(); });
    });
  }

  // 타임라인 빈 곳을 클릭하거나 드래그하면 그 시각(또는 드래그한 범위)에 바로 습관 추가 시트가 열림
  function attachTimelineAddDrag(minM, slotCount) {
    const grid = $("tlGrid");
    if (!grid) return;

    const slotFromEvent = (e) => {
      const rect = grid.getBoundingClientRect();
      const y = (e.clientY ?? (e.touches && e.touches[0]?.clientY)) - rect.top;
      const slot = Math.floor(y / TL_ROW_PX);
      return Math.max(0, Math.min(slotCount - 1, slot));
    };

    grid.onpointerdown = (e) => {
      if (e.target.closest(".tl-task")) return; // 기존 항목 위 클릭은 무시(체크박스 등 정상 동작)
      const startSlot = slotFromEvent(e);
      tlAddState = { startSlot, currentSlot: startSlot, minM, moved: false };
      const preview = document.createElement("div");
      preview.className = "tl-add-preview";
      preview.id = "tlAddPreview";
      preview.style.gridRow = `${startSlot+1} / ${startSlot+2}`;
      grid.appendChild(preview);
      grid.setPointerCapture?.(e.pointerId);
    };
    grid.onpointermove = (e) => {
      if (!tlAddState) return;
      const slot = slotFromEvent(e);
      if (slot !== tlAddState.startSlot) tlAddState.moved = true;
      tlAddState.currentSlot = slot;
      const preview = $("tlAddPreview");
      if (preview) {
        const lo = Math.min(tlAddState.startSlot, slot), hi = Math.max(tlAddState.startSlot, slot);
        preview.style.gridRow = `${lo+1} / ${hi+2}`;
      }
    };
    const finish = () => {
      if (!tlAddState) return;
      const { startSlot, currentSlot, moved } = tlAddState;
      const lo = Math.min(startSlot, currentSlot), hi = Math.max(startSlot, currentSlot);
      const startMinute = minM + lo * TL_SLOT_MIN;
      const durationMinutes = moved ? (hi - lo + 1) * TL_SLOT_MIN : 30;
      $("tlAddPreview")?.remove();
      tlAddState = null;
      showTimelineInlineAdd(grid, lo + 1, hi + 2, startMinute, durationMinutes);
    };
    grid.onpointerup = finish;
    grid.onpointercancel = () => { $("tlAddPreview")?.remove(); tlAddState = null; };
  }

  // 팝업 없이 타임라인 그 자리에 바로 입력창을 띄움 (Enter/바깥 클릭 시 저장, Esc면 취소)
  function showTimelineInlineAdd(grid, startRow, endRow, startMinute, durationMinutes) {
    const el = document.createElement("div");
    el.className = "tl-task tl-inline-add";
    el.style.gridRow = `${startRow} / ${endRow}`;
    el.innerHTML = `<input type="text" class="inline-add-input" placeholder="습관 이름" />`;
    grid.appendChild(el);
    const input = el.querySelector("input");
    input.focus();
    let done = false;
    const commit = async () => {
      if (done) return;
      const name = input.value.trim();
      if (!name) { el.remove(); return; }
      done = true;
      const { error } = await sb.from("tok_habits").insert({ name, sort_order: tasks.length, start_minute: startMinute, duration_minutes: durationMinutes, repeat_unit: "day", repeat_interval: 1 });
      if (error) { alert("저장 실패: " + error.message); done = false; return; }
      await loadAll();
    };
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); commit(); }
      else if (e.key === "Escape") { done = true; el.remove(); }
    });
    input.addEventListener("blur", commit);
  }

  // ── 할일 탭 : 다가오는 계획 (7일 보드) ──
  // tok_todos(날짜 있는 1회성 할일)만 보여줌 — 습관 실행은 '습관' 탭으로 이동함.
  // 빈 날짜를 클릭하면 그 날짜로, 여러 날짜에 걸쳐 세로로 드래그하면 시작~종료 기간으로 할일 추가 시트가 열림.
  function planDayList() {
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date();
      d.setDate(d.getDate() + i);
      days.push(d.toISOString().slice(0, 10));
    }
    return days;
  }

  function renderPlanBoard() {
    const days = planDayList();

    $("planBoard").innerHTML = days.map((dateStr, idx) => {
      const dayTodos = todos.filter(td => td.start_date <= dateStr && (td.end_date || td.start_date) >= dateStr);
      const todoHtml = dayTodos.map(td => {
        const isRange = td.end_date && td.end_date !== td.start_date;
        return `<div class="plan-row todo ${td.is_done?'done':''}" data-id="${td.id}">
          <input type="checkbox" ${td.is_done?"checked":""} data-id="${td.id}" class="plan-todo-check" />
          <span class="plan-todo-title">${escapeHtml(td.title)}</span>
          ${isRange ? `<span class="plan-range-tag">~${formatDateShort(td.end_date)}</span>` : ""}
          <button class="plan-todo-edit" data-id="${td.id}">✎</button>
        </div>`;
      }).join("");
      const bodyHtml = todoHtml;
      return `<div class="plan-day" data-idx="${idx}" data-date="${dateStr}">
        <div class="plan-day-label">${idx===0 ? "오늘" : formatDateShort(dateStr)}</div>
        <div class="plan-day-body">${bodyHtml || '<div class="plan-day-empty">+ 추가</div>'}</div>
      </div>`;
    }).join("");

    document.querySelectorAll(".plan-todo-check").forEach(cb => {
      cb.onchange = async () => {
        const { error } = await sb.from("tok_todos").update({ is_done: cb.checked }).eq("id", cb.dataset.id);
        if (error) { alert("변경 실패: " + error.message); return; }
        const t = todos.find(x => x.id === cb.dataset.id);
        if (t) t.is_done = cb.checked;
        renderPlanBoard();
      };
    });
    document.querySelectorAll(".plan-todo-edit").forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        openTodoSheet(todos.find(t => t.id === btn.dataset.id));
      };
    });
    // 클릭 → 수정(연필 아이콘과 동일하게 수정 시트가 열림. 날짜 두 개를 같이 바꿔야 해서 인라인 대신 시트 유지)
    document.querySelectorAll(".plan-row.todo .plan-todo-title").forEach(titleEl => {
      titleEl.onclick = (e) => {
        e.stopPropagation();
        const id = titleEl.closest(".plan-row").dataset.id;
        openTodoSheet(todos.find(t => t.id === id));
      };
    });
    // 오른쪽 클릭 → 삭제 메뉴
    document.querySelectorAll(".plan-row.todo").forEach(row => {
      row.oncontextmenu = (e) => {
        e.preventDefault();
        showDeleteMenu(e.clientX, e.clientY, async () => {
          if (!confirm("이 할일을 삭제할까요?")) return;
          const { error } = await sb.from("tok_todos").delete().eq("id", row.dataset.id);
          if (error) { alert("삭제 실패: " + error.message); return; }
          await loadAll();
        });
      };
    });

    attachPlanBoardDrag(days);
  }

  let planAddState = null;
  function attachPlanBoardDrag(days) {
    const board = $("planBoard");
    if (!board) return;

    const idxFromPoint = (x, y) => {
      const el = document.elementFromPoint(x, y)?.closest(".plan-day");
      return el ? parseInt(el.dataset.idx, 10) : null;
    };
    const highlight = (a, b) => {
      const lo = Math.min(a, b), hi = Math.max(a, b);
      document.querySelectorAll(".plan-day").forEach(el => {
        const idx = parseInt(el.dataset.idx, 10);
        el.classList.toggle("drag-hi", idx >= lo && idx <= hi);
      });
    };
    const clearHighlight = () => document.querySelectorAll(".plan-day").forEach(el => el.classList.remove("drag-hi"));

    board.onpointerdown = (e) => {
      if (e.target.closest(".plan-todo-check") || e.target.closest(".plan-todo-edit") || e.target.closest(".plan-todo-title") || e.target.closest(".home-check")) return;
      const dayEl = e.target.closest(".plan-day");
      if (!dayEl) return;
      const startIdx = parseInt(dayEl.dataset.idx, 10);
      planAddState = { startIdx, currentIdx: startIdx, moved: false };
      board.setPointerCapture?.(e.pointerId);
      highlight(startIdx, startIdx);
    };
    board.onpointermove = (e) => {
      if (!planAddState) return;
      const idx = idxFromPoint(e.clientX, e.clientY);
      if (idx == null) return;
      if (idx !== planAddState.startIdx) planAddState.moved = true;
      planAddState.currentIdx = idx;
      highlight(planAddState.startIdx, idx);
    };
    const finish = () => {
      if (!planAddState) return;
      const { startIdx, currentIdx, moved } = planAddState;
      const lo = Math.min(startIdx, currentIdx), hi = Math.max(startIdx, currentIdx);
      clearHighlight();
      planAddState = null;
      const dayEl = document.querySelector(`.plan-day[data-idx="${lo}"]`);
      const body = dayEl?.querySelector(".plan-day-body");
      if (body) showPlanInlineAdd(body, days[lo], moved ? days[hi] : null);
    };
    board.onpointerup = finish;
    board.onpointercancel = () => { clearHighlight(); planAddState = null; };
  }

  // 팝업 없이 그 날짜 칸에 바로 입력창을 추가함(기존 항목은 그대로 두고 입력창만 덧붙임)
  // onEmpty: 입력 없이 취소했을 때 다시 그릴 렌더 함수(어느 보드에서 호출했는지에 따라 다름)
  function showPlanInlineAdd(body, startDate, endDate, onEmpty = renderPlanBoard) {
    const emptyTag = body.querySelector(".plan-day-empty, .planup-day-empty");
    if (emptyTag) emptyTag.remove();
    const row = document.createElement("div");
    row.className = "plan-inline-add";
    row.innerHTML = `<input type="text" class="inline-add-input" placeholder="할일 제목" />`;
    body.appendChild(row);
    const input = row.querySelector("input");
    input.focus();
    let done = false;
    const commit = async () => {
      if (done) return;
      const title = input.value.trim();
      if (!title) { row.remove(); if (!body.children.length) onEmpty(); return; }
      done = true;
      const { error } = await sb.from("tok_todos").insert({ title, start_date: startDate, end_date: endDate });
      if (error) { alert("저장 실패: " + error.message); done = false; return; }
      await loadAll();
    };
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); commit(); }
      else if (e.key === "Escape") { done = true; row.remove(); if (!body.children.length) onEmpty(); }
    });
    input.addEventListener("blur", commit);
  }

  // existing: 수정, null: 새로 추가(prefill로 시작~종료 날짜 지정 가능)
  function openTodoSheet(existing, prefill) {
    $("todoSheetTitle").textContent = existing ? "할일 수정" : "할일 추가";
    $("td_title").value = existing ? existing.title : "";
    $("td_start").value = existing ? existing.start_date : (prefill?.startDate || todayStr());
    $("td_end").value = existing ? (existing.end_date || "") : (prefill?.endDate || "");
    $("td_time").value = existing ? (existing.todo_time ? existing.todo_time.slice(0, 5) : "") : (prefill?.time || "");
    $("todoSheetBg").dataset.editId = existing ? existing.id : "";
    $("todoDeleteRow").style.display = existing ? "flex" : "none";
    $("todoSheetBg").classList.add("open");
    $("td_title").focus();
  }
  $("todoCancelBtn").onclick = () => $("todoSheetBg").classList.remove("open");
  $("todoSaveBtn").onclick = async () => {
    const title = $("td_title").value.trim();
    const start_date = $("td_start").value;
    const end_date = $("td_end").value || null;
    const todo_time = $("td_time").value ? $("td_time").value + ":00" : null;
    if (!title || !start_date) { alert("제목과 시작 날짜는 꼭 입력해주세요."); return; }
    if (end_date && end_date < start_date) { alert("종료 날짜는 시작 날짜보다 빠를 수 없어요."); return; }
    const editId = $("todoSheetBg").dataset.editId;
    let error;
    if (editId) {
      ({ error } = await sb.from("tok_todos").update({ title, start_date, end_date, todo_time }).eq("id", editId));
    } else {
      ({ error } = await sb.from("tok_todos").insert({ title, start_date, end_date, todo_time }));
    }
    if (error) { alert("저장 실패: " + error.message); return; }
    $("todoSheetBg").classList.remove("open");
    await loadAll();
  };
  $("todoDeleteBtn").onclick = async () => {
    const editId = $("todoSheetBg").dataset.editId;
    if (!editId) return;
    if (!confirm("이 할일을 삭제할까요?")) return;
    const { error } = await sb.from("tok_todos").delete().eq("id", editId);
    if (error) { alert("삭제 실패: " + error.message); return; }
    $("todoSheetBg").classList.remove("open");
    await loadAll();
  };

  // ── 습관 반복·카테고리 설정 시트 ──
  function populateHabitCategorySelect(selectedId) {
    const sel = $("hs_category");
    sel.innerHTML = `<option value="">카테고리 없음</option>` +
      habitCategories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
    sel.value = selectedId || "";
  }
  function openHabitSheet(habit) {
    if (!habit) return;
    $("habitSheetBg").dataset.editId = habit.id;
    $("hs_repeat_unit").value = habit.repeat_unit || "";
    $("hs_repeat_interval").value = habit.repeat_interval || 1;
    populateHabitCategorySelect(habit.category_id);
    $("hs_newcat_name").value = "";
    $("habitSheetBg").classList.add("open");
  }
  $("habitSheetCancelBtn").onclick = () => $("habitSheetBg").classList.remove("open");
  $("hs_newcat_btn").onclick = async () => {
    const name = $("hs_newcat_name").value.trim();
    if (!name) { alert("카테고리 이름을 입력해주세요."); return; }
    const color = $("hs_newcat_color").value;
    const { data, error } = await sb.from("tok_habit_categories")
      .insert({ name, color, sort_order: habitCategories.length })
      .select().single();
    if (error) { alert("카테고리 추가 실패: " + error.message); return; }
    habitCategories.push(data);
    populateHabitCategorySelect(data.id);
    $("hs_newcat_name").value = "";
  };
  $("habitSheetSaveBtn").onclick = async () => {
    const editId = $("habitSheetBg").dataset.editId;
    if (!editId) return;
    const repeat_unit = $("hs_repeat_unit").value || null;
    const repeat_interval = repeat_unit ? (parseInt($("hs_repeat_interval").value, 10) || 1) : null;
    const category_id = $("hs_category").value || null;
    const { error } = await sb.from("tok_habits").update({ repeat_unit, repeat_interval, category_id }).eq("id", editId);
    if (error) { alert("저장 실패: " + error.message); return; }
    $("habitSheetBg").classList.remove("open");
    await loadAll();
  };

  $("viewListBtn").onclick = () => {
    homeView = "list";
    $("viewListBtn").classList.add("active");
    $("viewTimelineBtn").classList.remove("active");
    renderTodo();
  };
  $("viewTimelineBtn").onclick = () => {
    homeView = "timeline";
    $("viewTimelineBtn").classList.add("active");
    $("viewListBtn").classList.remove("active");
    renderTodo();
  };


  // ── 집 : 언젠가 할일 ──
  function renderSomeday() {
    const sorted = [...somedayItems].sort((a, b) => (a.is_done === b.is_done) ? 0 : (a.is_done ? 1 : -1));
    $("somedayList").innerHTML = sorted.map(item => `
      <div class="someday-row ${item.is_done?'done':''}" data-id="${item.id}">
        <input type="checkbox" ${item.is_done?"checked":""} data-id="${item.id}" class="someday-check" />
        <span class="someday-title">${escapeHtml(item.title)}</span>
        <button class="del" data-id="${item.id}">삭제</button>
      </div>
    `).join("");
    document.querySelectorAll(".someday-check").forEach(cb => {
      cb.onchange = async () => {
        const { error } = await sb.from("tok_someday").update({ is_done: cb.checked }).eq("id", cb.dataset.id);
        if (error) { alert("변경 실패: " + error.message); return; }
        const item = somedayItems.find(s => s.id === cb.dataset.id);
        if (item) item.is_done = cb.checked;
        renderSomeday();
      };
    });
    document.querySelectorAll("#somedayList .del").forEach(btn => {
      btn.onclick = async () => {
        const { error } = await sb.from("tok_someday").delete().eq("id", btn.dataset.id);
        if (error) { alert("삭제 실패: " + error.message); return; }
        somedayItems = somedayItems.filter(s => s.id !== btn.dataset.id);
        renderSomeday();
      };
    });

    // 클릭 → 제목 인라인 수정
    document.querySelectorAll(".someday-title").forEach(titleEl => {
      titleEl.onclick = () => {
        const id = titleEl.closest(".someday-row").dataset.id;
        const current = titleEl.textContent;
        const input = document.createElement("input");
        input.type = "text";
        input.className = "inline-add-input";
        input.value = current;
        titleEl.replaceWith(input);
        input.focus(); input.select();
        let done = false;
        const commit = async () => {
          if (done) return;
          const title = input.value.trim();
          if (!title || title === current) { renderSomeday(); return; }
          done = true;
          const { error } = await sb.from("tok_someday").update({ title }).eq("id", id);
          if (error) { alert("수정 실패: " + error.message); done = false; return; }
          const item = somedayItems.find(s => s.id === id);
          if (item) item.title = title;
          renderSomeday();
        };
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); commit(); }
          else if (e.key === "Escape") { done = true; renderSomeday(); }
        });
        input.addEventListener("blur", commit);
      };
    });
    // 오른쪽 클릭 → 삭제 메뉴
    document.querySelectorAll(".someday-row").forEach(row => {
      row.oncontextmenu = (e) => {
        e.preventDefault();
        showDeleteMenu(e.clientX, e.clientY, async () => {
          const { error } = await sb.from("tok_someday").delete().eq("id", row.dataset.id);
          if (error) { alert("삭제 실패: " + error.message); return; }
          somedayItems = somedayItems.filter(s => s.id !== row.dataset.id);
          renderSomeday();
        });
      };
    });
  }
  $("somedayAddBtn").onclick = async () => {
    const title = $("somedayInput").value.trim();
    if (!title) return;
    const { data, error } = await sb.from("tok_someday").insert({ title }).select().single();
    if (error) { alert("추가 실패: " + error.message); return; }
    somedayItems.push(data);
    $("somedayInput").value = "";
    renderSomeday();
  };
  $("somedayInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") $("somedayAddBtn").click();
  });

  // ── 일정 화면 ──
  function renderSchedule() {
    $("scheduleEmpty").style.display = events.length ? "none" : "block";
    const groups = {};
    events.forEach(e => { (groups[e.event_date] ||= []).push(e); });
    const dates = Object.keys(groups).sort();
    $("scheduleList").innerHTML = dates.map(d => `
      <div class="day-group">
        <div class="day-label">${formatDate(d)}</div>
        <div class="card">
          ${groups[d].map(e => `
            <div class="event-row" data-id="${e.id}">
              <div class="t">${e.event_time ? e.event_time.slice(0,5) : ""}</div>
              <div class="body">
                <div class="title">${escapeHtml(e.title)}</div>
                ${e.memo ? `<div class="memo">${escapeHtml(e.memo)}</div>` : ""}
              </div>
              <button class="del" data-id="${e.id}">삭제</button>
            </div>`).join("")}
        </div>
      </div>
    `).join("");
    document.querySelectorAll("#scheduleList .del").forEach(btn => {
      btn.onclick = async () => {
        if (!confirm("이 일정을 삭제할까요?")) return;
        const { error } = await sb.from("tok_events").delete().eq("id", btn.dataset.id);
        if (error) { alert("삭제 실패: " + error.message); return; }
        await loadAll();
      };
    });

    // 클릭 → 제목 인라인 수정
    document.querySelectorAll("#scheduleList .title").forEach(titleEl => {
      titleEl.onclick = () => {
        const id = titleEl.closest(".event-row").dataset.id;
        const current = titleEl.textContent;
        const input = document.createElement("input");
        input.type = "text";
        input.className = "inline-add-input";
        input.value = current;
        titleEl.replaceWith(input);
        input.focus(); input.select();
        let done = false;
        const commit = async () => {
          if (done) return;
          const title = input.value.trim();
          if (!title || title === current) { renderSchedule(); return; }
          done = true;
          const { error } = await sb.from("tok_events").update({ title }).eq("id", id);
          if (error) { alert("수정 실패: " + error.message); done = false; return; }
          await loadAll();
        };
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); commit(); }
          else if (e.key === "Escape") { done = true; renderSchedule(); }
        });
        input.addEventListener("blur", commit);
      };
    });
    // 오른쪽 클릭 → 삭제 메뉴
    document.querySelectorAll("#scheduleList .event-row").forEach(row => {
      row.oncontextmenu = (e) => {
        e.preventDefault();
        showDeleteMenu(e.clientX, e.clientY, async () => {
          if (!confirm("이 일정을 삭제할까요?")) return;
          const { error } = await sb.from("tok_events").delete().eq("id", row.dataset.id);
          if (error) { alert("삭제 실패: " + error.message); return; }
          await loadAll();
        });
      };
    });
  }

  function formatDate(d) {
    const dt = new Date(d + "T00:00:00");
    const days = ["일","월","화","수","목","금","토"];
    return `${dt.getMonth()+1}월 ${dt.getDate()}일 (${days[dt.getDay()]})`;
  }
  function formatDateShort(d) {
    if (d === todayStr()) return "오늘";
    const dt = new Date(d + "T00:00:00");
    const days = ["일","월","화","수","목","금","토"];
    return `${dt.getMonth()+1}/${dt.getDate()}(${days[dt.getDay()]})`;
  }

  // ── 습관 탭: 실행뷰(타임블럭/타임라인) + 습관 관리 목록 ──
  function renderTodo() {
    const active = tasks.filter(t => t.is_active);
    $("homeEmpty").style.display = active.length ? "none" : "block";
    if (homeView === "timeline") renderHomeTimeline(active);
    else renderHomeBlocks(active);
    document.querySelectorAll(".home-check").forEach(cb => {
      cb.onchange = () => toggleToday(cb.dataset.id, cb.checked);
    });

    $("todoEmpty").style.display = tasks.length ? "none" : "block";
    $("todoList").innerHTML = tasks.map(t => {
      const cat = habitCategories.find(c => c.id === t.category_id);
      const repeatText = t.repeat_unit ? `${t.repeat_interval || 1}${{day:"일",week:"주",month:"개월"}[t.repeat_unit]}마다` : "반복 없음";
      const catChip = cat ? `<span class="habit-cat-chip" style="background:${cat.color || "var(--accent-soft)"}">${escapeHtml(cat.name)}</span>` : "";
      return `
      <div class="todo-row ${t.is_active?"":"inactive"}" data-id="${t.id}">
        <div class="info">
          <div class="name">${escapeHtml(t.name)}</div>
          <div class="block-tag">${t.start_minute != null ? minutesToHHMM(t.start_minute) : "시간 없음"} · ${t.duration_minutes || 30}분 · ${repeatText}${catChip}</div>
        </div>
        <button class="settingsbtn" data-id="${t.id}" title="반복·카테고리 설정">⚙</button>
        <button class="togglebtn ${t.is_active?"on":""}" data-id="${t.id}" data-active="${t.is_active}">${t.is_active?"진행중":"멈춤"}</button>
        <button class="del" data-id="${t.id}">삭제</button>
      </div>
    `;
    }).join("");
    document.querySelectorAll("#todoList .settingsbtn").forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        openHabitSheet(tasks.find(t => t.id === btn.dataset.id));
      };
    });
    document.querySelectorAll("#todoList .togglebtn").forEach(btn => {
      btn.onclick = async () => {
        const newActive = !(btn.dataset.active === "true");
        const { error } = await sb.from("tok_habits").update({ is_active: newActive }).eq("id", btn.dataset.id);
        if (error) { alert("변경 실패: " + error.message); return; }
        await loadAll();
      };
    });
    document.querySelectorAll("#todoList .del").forEach(btn => {
      btn.onclick = async () => {
        if (!confirm("이 습관을 삭제할까요? (기록도 함께 삭제돼요)")) return;
        const { error } = await sb.from("tok_habits").delete().eq("id", btn.dataset.id);
        if (error) { alert("삭제 실패: " + error.message); return; }
        await loadAll();
      };
    });

    // 클릭 → 이름 인라인 수정
    document.querySelectorAll("#todoList .name").forEach(nameEl => {
      nameEl.onclick = () => {
        const id = nameEl.closest(".todo-row").dataset.id;
        const current = nameEl.textContent;
        const input = document.createElement("input");
        input.type = "text";
        input.className = "inline-add-input";
        input.value = current;
        nameEl.replaceWith(input);
        input.focus(); input.select();
        let done = false;
        const commit = async () => {
          if (done) return;
          const name = input.value.trim();
          if (!name || name === current) { renderTodo(); return; }
          done = true;
          const { error } = await sb.from("tok_habits").update({ name }).eq("id", id);
          if (error) { alert("수정 실패: " + error.message); done = false; return; }
          await loadAll();
        };
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); commit(); }
          else if (e.key === "Escape") { done = true; renderTodo(); }
        });
        input.addEventListener("blur", commit);
      };
    });
    // 오른쪽 클릭 → 삭제 메뉴
    document.querySelectorAll("#todoList .todo-row").forEach(row => {
      row.oncontextmenu = (e) => {
        e.preventDefault();
        showDeleteMenu(e.clientX, e.clientY, async () => {
          if (!confirm("이 습관을 삭제할까요? (기록도 함께 삭제돼요)")) return;
          const { error } = await sb.from("tok_habits").delete().eq("id", row.dataset.id);
          if (error) { alert("삭제 실패: " + error.message); return; }
          await loadAll();
        });
      };
    });
  }

  // ── 일정/습관 화면 상단 인라인 추가 입력 (팝업 없이 바로 입력) ──
  $("ev_date").value = todayStr();
  $("eventAddBtn").onclick = async () => {
    const title = $("ev_title").value.trim();
    const event_date = $("ev_date").value;
    if (!title || !event_date) { alert("날짜와 제목은 꼭 입력해주세요."); return; }
    const { error } = await sb.from("tok_events").insert({
      event_date, event_time: $("ev_time").value || null, title, memo: null,
    });
    if (error) { alert("저장 실패: " + error.message); return; }
    $("ev_title").value = "";
    await loadAll();
    $("ev_title").focus();
  };
  $("ev_title").addEventListener("keydown", (e) => { if (e.key === "Enter") $("eventAddBtn").click(); });

  $("taskAddBtn").onclick = async () => {
    const name = $("tk_name").value.trim();
    if (!name) { alert("습관 이름을 입력해주세요."); return; }
    const startVal = $("tk_start").value; // "HH:MM" 또는 빈 문자열
    const start_minute = startVal ? (parseInt(startVal.slice(0,2),10)*60 + parseInt(startVal.slice(3,5),10)) : null;
    const duration_minutes = parseInt($("tk_duration").value, 10) || 30;
    const { error } = await sb.from("tok_habits").insert({ name, sort_order: tasks.length, start_minute, duration_minutes, repeat_unit: "day", repeat_interval: 1 });
    if (error) { alert("저장 실패: " + error.message); return; }
    $("tk_name").value = "";
    await loadAll();
    $("tk_name").focus();
  };
  $("tk_name").addEventListener("keydown", (e) => { if (e.key === "Enter") $("taskAddBtn").click(); });

  function escapeHtml(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  // 오른쪽 클릭(→ PC 관리 메뉴) 공통 헬퍼: 커서 위치에 "삭제" 한 줄짜리 메뉴를 띄움
  function showDeleteMenu(x, y, onDelete) {
    document.querySelector(".ctx-menu")?.remove();
    const menu = document.createElement("div");
    menu.className = "ctx-menu";
    menu.style.left = x + "px";
    menu.style.top = y + "px";
    menu.innerHTML = `<button type="button">삭제</button>`;
    document.body.appendChild(menu);
    menu.querySelector("button").onclick = async (e) => {
      e.stopPropagation();
      menu.remove();
      await onDelete();
    };
    setTimeout(() => {
      const closeOnOutside = (e) => {
        if (!menu.contains(e.target)) {
          menu.remove();
          document.removeEventListener("click", closeOnOutside);
          document.removeEventListener("contextmenu", closeOnOutside);
        }
      };
      document.addEventListener("click", closeOnOutside);
      document.addEventListener("contextmenu", closeOnOutside);
    }, 0);
  }

  boot();
</script>
</body>
</html>
