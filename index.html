<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>오늘한칸</title>
<style>
  :root{
    /* 파스텔 팔레트 */
    --bg:#f6f4fb; --card:#ffffff; --line:#ece6f6; --text:#3d3654; --sub:#9a92ad;
    --accent:#9a8cf0; --accent-soft:#efeaff; --danger:#f2a0a0; --ok:#8fd6b7;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;}

  /* ── 로그인 ── */
  #authBox{max-width:360px;margin:80px auto;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:16px;}
  #authBox h1{font-size:18px;margin:0 0 16px;}
  #authBox input{width:100%;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;font-size:14px;}
  #authBox button{width:100%;padding:10px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;cursor:pointer;margin-top:4px;}
  #authBox .alt{background:none;color:var(--accent);font-size:12px;padding:6px;}
  #authMsg{font-size:12px;color:var(--danger);min-height:16px;margin-top:4px;}

  /* ── 레이아웃 ── */
  #app{display:none;min-height:100vh;}
  .layout{display:flex;min-height:100vh;}
  .sidebar{width:180px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;}
  .sidebar h1{font-size:15px;margin:0 0 20px;padding-left:8px;}
  .navitem{display:flex;align-items:center;gap:8px;padding:10px 8px;border-radius:10px;color:var(--sub);font-size:14px;cursor:pointer;margin-bottom:4px;}
  .navitem.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .content{flex:1;min-width:0;padding:20px 24px 100px;max-width:640px;}
  .pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .pagehead h2{font-size:18px;margin:0;}
  #logoutBtn{background:none;border:none;color:var(--sub);font-size:12px;cursor:pointer;}

  .bottombar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:10;}
  .bottombar .navitem{flex:1;flex-direction:column;text-align:center;font-size:11px;margin:0;border-radius:0;padding:8px 0;}
  @media (max-width:760px){
    .sidebar{display:none;}
    .bottombar{display:flex;}
    .content{padding:16px 16px 90px;max-width:100%;}
  }

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:50px 0;}
  .section-label{font-size:12px;color:var(--sub);font-weight:700;margin:18px 2px 8px;}
  .section-label:first-child{margin-top:0;}

  /* ── 집 : 진행률 ── */
  .progress-wrap{background:linear-gradient(135deg,#ffe3ee,#e6f3ff 55%,#e3f9ee);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:6px;}
  .progress-text{font-size:14px;color:var(--text);font-weight:600;margin-bottom:8px;}
  .progress-bar{height:8px;background:rgba(255,255,255,.6);border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,#f6a8c7,#9a8cf0);border-radius:999px;transition:width .25s;}

  /* ── 집 : 다가오는 일정 ── */
  .upcoming-row{display:flex;align-items:baseline;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px;}
  .upcoming-row:last-child{border-bottom:none;}
  .upcoming-row .d{color:var(--accent);font-weight:600;flex-shrink:0;font-size:12px;}
  .upcoming-row .t{color:var(--sub);flex-shrink:0;font-size:11px;}
  .upcoming-row .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ── 집 : 습관 목록(행) ── */
  .task-row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);}
  .task-row:last-child{border-bottom:none;}
  .task-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
  .task-row span{font-size:14px;}
  .task-row.done span{color:var(--sub);text-decoration:line-through;}
  .block-add-row{padding:10px 4px;color:var(--sub);font-size:13px;text-align:center;cursor:pointer;border-top:1px dashed var(--line);}
  .block-add-row:hover{color:var(--accent);}

  /* ── 집 : 목록/타임라인 보기 전환 ── */
  .view-toggle{display:flex;gap:6px;margin-bottom:10px;}
  .view-toggle button{flex:1;padding:8px 0;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:13px;color:var(--sub);cursor:pointer;}
  .view-toggle button.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft);font-weight:600;}

  /* ── 집 : 타임라인 보기(15분 그리드, 습관은 시작시각·소요시간에 맞춰 배치) ── */
  .tl-grid{display:grid;grid-template-columns:44px 1fr;grid-auto-rows:13px;position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 0;overflow:hidden;touch-action:none;}
  .tl-row-label{grid-column:1;font-size:10px;color:var(--sub);text-align:right;padding-right:6px;transform:translateY(-6px);pointer-events:none;}
  .tl-row-line{grid-column:2;border-top:1px solid var(--line);pointer-events:none;}
  .tl-task{grid-column:2;display:flex;align-items:center;gap:6px;background:var(--accent-soft);border:1px solid #dfe3fb;border-radius:8px;margin:1px 8px;padding:0 8px;font-size:12px;position:relative;overflow:hidden;z-index:1;touch-action:none;cursor:pointer;}
  .tl-task.dragging{opacity:.85;box-shadow:0 3px 10px rgba(60,50,100,.18);z-index:5;cursor:grabbing;}
  .tl-task input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
  .tl-task .tl-title{font-size:12px;flex:1;}
  .tl-task.done .tl-title{color:var(--sub);text-decoration:line-through;}
  .tl-handle{position:absolute;left:0;right:0;height:6px;cursor:ns-resize;z-index:3;opacity:0;transition:opacity .12s;}
  .tl-handle:hover{opacity:1;}
  .tl-handle-top{top:0;}
  .tl-handle-bottom{bottom:0;}
  .tl-handle::after{content:"";display:block;margin:1px auto 0;width:22px;height:3px;border-radius:2px;background:var(--accent);opacity:.6;}
  .tl-add-preview{grid-column:2;background:rgba(154,140,240,.18);border:2px dashed var(--accent);border-radius:8px;margin:0 4px;pointer-events:none;}
  .tl-unassigned{margin-top:10px;}
  .tl-unassigned .section-label{margin:0 2px 8px;}

  /* ── 집 : 언젠가 할일 ── */
  .someday-add-row{display:flex;gap:6px;margin-bottom:8px;}
  .someday-add-row input{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px;}
  .someday-add-row button{padding:0 14px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:13px;cursor:pointer;}
  .someday-row{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px;}
  .someday-row:last-child{border-bottom:none;}
  .someday-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
  .someday-row span{flex:1;}
  .someday-row.done span{color:var(--sub);text-decoration:line-through;}

  /* ── 팝업 없이 바로 입력하는 공통 인라인 추가 스타일 ── */
  .inline-add-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .inline-add-row input{padding:9px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px;font-family:inherit;}
  .inline-add-row input[type=text]{flex:1;min-width:120px;}
  .inline-add-row input[type=date],.inline-add-row input[type=time]{flex:0 0 auto;}
  .inline-add-row input[type=number]{width:64px;flex:0 0 auto;}
  .inline-add-row button{padding:0 14px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:13px;cursor:pointer;flex-shrink:0;}
  .inline-add-input{width:100%;padding:5px 7px;border:1px solid var(--accent);border-radius:6px;font-size:13px;font-family:inherit;background:#fff;}
  .tl-inline-add{padding:0 4px;}
  .tl-inline-add .inline-add-input{padding:2px 6px;font-size:12px;}

  /* ── 클릭=수정, 오른쪽클릭=삭제 메뉴 ── */
  .todo-row .name, .event-row .title, .someday-title, .plan-row.todo .plan-todo-title{cursor:pointer;}
  .todo-row .name:hover, .event-row .title:hover, .someday-title:hover, .plan-row.todo .plan-todo-title:hover{color:var(--accent);}
  .ctx-menu{position:fixed;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:4px;z-index:30;}
  .ctx-menu button{display:block;width:100%;padding:8px 16px;border:none;background:none;color:var(--danger);font-size:13px;text-align:left;cursor:pointer;border-radius:6px;white-space:nowrap;}
  .ctx-menu button:hover{background:var(--bg);}

  /* ── 집 : 2열 레이아웃 (1열 습관 실행, 2열 다가오는 계획+언젠가 할일) ── */
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
  .home-col{min-width:0;}
  @media (max-width:760px){ .home-grid{grid-template-columns:1fr;} }

  /* ── 집 : 다가오는 계획 (7일 보드) ── */
  .plan-day{padding:8px 4px;border-bottom:1px solid var(--line);touch-action:none;}
  .plan-day:last-child{border-bottom:none;}
  .plan-day.drag-hi{background:var(--accent-soft);border-radius:8px;}
  .plan-day-label{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:4px;}
  .plan-day-body{display:flex;flex-direction:column;gap:4px;}
  .plan-row{display:flex;align-items:center;gap:6px;font-size:13px;padding:2px 0;}
  .plan-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
  .plan-row.done .plan-todo-title{color:var(--sub);text-decoration:line-through;}
  .plan-row.habit{color:var(--accent);}
  .plan-todo-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .plan-range-tag{font-size:10px;color:var(--sub);flex-shrink:0;}
  .plan-todo-edit{border:none;background:none;color:var(--sub);font-size:12px;cursor:pointer;flex-shrink:0;padding:2px 4px;}
  .plan-day-empty{font-size:12px;color:var(--sub);opacity:.5;padding:4px 0;}

  /* ── 일정 화면 ── */
  .day-group{margin-bottom:14px;}
  .day-label{font-size:12px;color:var(--sub);margin:0 0 6px 2px;font-weight:600;}
  .event-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);}
  .event-row:last-child{border-bottom:none;}
  .event-row .t{font-size:12px;color:var(--sub);width:48px;flex-shrink:0;}
  .event-row .body{flex:1;min-width:0;}
  .event-row .title{font-size:14px;}
  .event-row .memo{font-size:12px;color:var(--sub);margin-top:2px;}
  .event-row .del{border:none;background:none;color:var(--danger);font-size:12px;cursor:pointer;flex-shrink:0;}

  /* ── 습관 관리 화면 ── */
  .todo-row{display:flex;align-items:center;gap:8px;padding:12px 4px;border-bottom:1px solid var(--line);}
  .todo-row:last-child{border-bottom:none;}
  .todo-row .info{flex:1;min-width:0;}
  .todo-row .name{font-size:14px;}
  .todo-row .block-tag{font-size:11px;color:var(--sub);}
  .todo-row.inactive .name{color:var(--sub);}
  .togglebtn{border:1px solid var(--line);background:#fff;border-radius:999px;font-size:11px;padding:4px 10px;cursor:pointer;color:var(--sub);flex-shrink:0;}
  .togglebtn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft);}
  .del{border:none;background:none;color:var(--danger);font-size:12px;cursor:pointer;flex-shrink:0;}

  .fab{position:fixed;right:20px;bottom:24px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:26px;box-shadow:0 6px 16px rgba(154,140,240,.4);cursor:pointer;z-index:8;}
  @media (max-width:760px){ .fab{bottom:78px;} }

  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:20;}
  .sheet-bg.open{display:flex;}
  .sheet{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 16px 24px;max-height:88vh;overflow-y:auto;}
  .sheet h2{font-size:15px;margin:0 0 12px;}
  .field{margin-bottom:10px;}
  .field label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px;}
  .field input, .field textarea, .field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;}
  .field.split{display:flex;gap:8px;}
  .field.split > div{flex:1;}
  .sheet-actions{display:flex;gap:8px;margin-top:14px;}
  .sheet-actions button{flex:1;padding:11px;border-radius:10px;border:none;font-size:14px;cursor:pointer;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-ghost{background:var(--bg);color:var(--sub);}
</style>
</head>
<body>

<div id="authBox">
  <h1>오늘한칸</h1>
  <div id="authMsg"></div>
  <input id="authEmail" type="email" placeholder="이메일" autocomplete="username" />
  <input id="authPw" type="password" placeholder="비밀번호 (8자 이상)" autocomplete="current-password" />
  <button id="loginBtn">로그인</button>
  <button id="signupBtn" class="alt">계정이 없다면 회원가입</button>
</div>

<div id="app">
  <div class="layout">
    <div class="sidebar">
      <h1>오늘한칸</h1>
      <div class="navitem" data-page="home">🏠 집</div>
      <div class="navitem" data-page="schedule">📅 일정</div>
      <div class="navitem" data-page="todo">✅ 습관</div>
      <div style="margin-top:20px;"><button id="logoutBtn">로그아웃</button></div>
    </div>

    <div class="content">
      <!-- 집 -->
      <div class="page" data-page="home">
        <div class="pagehead"><h2>🏠 집</h2></div>

        <div class="progress-wrap">
          <div class="progress-text" id="homeProgressText">오늘 0/0 완료</div>
          <div class="progress-bar"><div class="progress-fill" id="homeProgressFill" style="width:0%"></div></div>
        </div>

        <div class="section-label">📅 다가오는 일정</div>
        <div class="card" id="upcomingCard"></div>
        <div id="upcomingEmpty" class="empty" style="display:none;padding:16px 0;">다가오는 일정이 없어요.</div>

        <div class="home-grid">
          <div class="home-col">
            <div class="section-label">🕒 오늘의 습관</div>
            <div class="view-toggle">
              <button id="viewListBtn" class="active">타임블럭</button>
              <button id="viewTimelineBtn">타임라인</button>
            </div>
            <div id="timelineWrap"></div>
            <div id="homeEmpty" class="empty" style="display:none;">아직 등록한 습관이 없어요.<br/>'습관' 탭에서 먼저 추가해보세요.</div>
          </div>

          <div class="home-col">
            <div class="section-label">🗓 다가오는 계획</div>
            <div class="card" id="planBoard"></div>

            <div class="section-label">💭 언젠가 할일</div>
            <div class="card">
              <div class="someday-add-row">
                <input id="somedayInput" type="text" placeholder="나중에 할 것 같은 일 아무거나 적어보세요" />
                <button id="somedayAddBtn">추가</button>
              </div>
              <div id="somedayList"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 일정 -->
      <div class="page" data-page="schedule" style="display:none;">
        <div class="pagehead"><h2>📅 일정</h2></div>
        <div class="inline-add-row">
          <input id="ev_date" type="date" />
          <input id="ev_time" type="time" />
          <input id="ev_title" type="text" placeholder="일정 제목" />
          <button id="eventAddBtn">추가</button>
        </div>
        <div id="scheduleList"></div>
        <div id="scheduleEmpty" class="empty" style="display:none;">등록된 일정이 없어요.<br/>위 입력창에서 바로 추가해보세요.</div>
      </div>

      <!-- 습관 -->
      <div class="page" data-page="todo" style="display:none;">
        <div class="pagehead"><h2>✅ 습관 관리</h2></div>
        <div class="inline-add-row">
          <input id="tk_name" type="text" placeholder="습관 이름" />
          <input id="tk_start" type="time" />
          <input id="tk_duration" type="number" min="15" step="15" placeholder="분" value="30" />
          <button id="taskAddBtn">추가</button>
        </div>
        <div id="todoList"></div>
        <div id="todoEmpty" class="empty" style="display:none;">등록된 습관이 없어요.<br/>위 입력창에서 바로 추가해보세요.</div>
      </div>
    </div>
  </div>

  <div class="bottombar">
    <div class="navitem" data-page="home">🏠<br/>집</div>
    <div class="navitem" data-page="schedule">📅<br/>일정</div>
    <div class="navitem" data-page="todo">✅<br/>습관</div>
  </div>
</div>

<!-- 할일 추가/수정 시트 (다가오는 계획 보드용) -->
<div class="sheet-bg" id="todoSheetBg">
  <div class="sheet">
    <h2 id="todoSheetTitle">할일 추가</h2>
    <div class="field"><label>할일 제목</label><input id="td_title" type="text" placeholder="예: 은행 다녀오기" /></div>
    <div class="field split">
      <div><label>시작 날짜</label><input id="td_start" type="date" /></div>
      <div><label>종료 날짜(선택, 기간이면)</label><input id="td_end" type="date" /></div>
    </div>
    <div class="sheet-actions">
      <button class="btn-ghost" id="todoCancelBtn">취소</button>
      <button class="btn-primary" id="todoSaveBtn">저장</button>
    </div>
    <div class="sheet-actions" id="todoDeleteRow" style="display:none;">
      <button class="btn-ghost" id="todoDeleteBtn" style="color:var(--danger);">이 할일 삭제</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  // ── Supabase 설정 (그리지우 프로젝트, tok_ 접두사 테이블 사용) ──
  const SUPABASE_URL = "https://mmpsyajgyufdxmmnxqba.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_odr6eVpfut1PbfGcG9vDYQ_pKEVFggA";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = (id) => document.getElementById(id);
  const todayStr = () => new Date().toISOString().slice(0,10);
  const pad2 = (n) => String(n).padStart(2, "0");
  const minutesToHHMM = (m) => `${pad2(Math.floor(m/60) % 24)}:${pad2(m%60)}`;

  let tasks = [];
  let logsToday = new Set(); // habit_id set, 오늘 완료된 것
  let events = [];
  let somedayItems = [];
  let timeBlocks = []; // tok_time_blocks: 타임블럭 탭의 이름표 그룹핑용
  let todos = []; // tok_todos: 다가오는 계획 보드용 (날짜 있는 1회성 할일)
  let currentPage = "home";
  let homeView = "list"; // "list" | "timeline"

  // ── 인증 ──
  $("loginBtn").onclick = async () => {
    const email = $("authEmail").value.trim();
    const password = $("authPw").value;
    $("authMsg").textContent = "";
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { $("authMsg").textContent = error.message; return; }
    await boot();
  };
  $("signupBtn").onclick = async () => {
    const email = $("authEmail").value.trim();
    const password = $("authPw").value;
    $("authMsg").textContent = "";
    if (password.length < 8) { $("authMsg").textContent = "비밀번호는 8자 이상이어야 해요."; return; }
    const { error } = await sb.auth.signUp({ email, password });
    if (error) { $("authMsg").textContent = error.message; return; }
    $("authMsg").style.color = "var(--ok)";
    $("authMsg").textContent = "가입 완료! 로그인 버튼을 눌러주세요.";
  };
  $("logoutBtn").onclick = async () => { await sb.auth.signOut(); location.reload(); };

  async function boot() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return;
    $("authBox").style.display = "none";
    $("app").style.display = "block";
    await loadAll();
    showPage("home");
  }

  // ── 네비게이션 ──
  document.querySelectorAll(".navitem").forEach(el => {
    el.onclick = () => showPage(el.dataset.page);
  });
  function showPage(page) {
    currentPage = page;
    document.querySelectorAll(".navitem").forEach(el => el.classList.toggle("active", el.dataset.page === page));
    document.querySelectorAll(".page").forEach(el => el.style.display = el.dataset.page === page ? "block" : "none");
  }

  // ── 데이터 로드 ──
  async function loadAll() {
    const [
      { data: taskData, error: e1 },
      { data: logData, error: e2 },
      { data: eventData, error: e3 },
      { data: somedayData, error: e5 },
      { data: blockData, error: e6 },
      { data: todoData, error: e7 },
    ] = await Promise.all([
      sb.from("tok_habits").select("*").order("start_minute", { nullsFirst: false }).order("created_at"),
      sb.from("tok_habit_logs").select("habit_id").eq("done_date", todayStr()),
      sb.from("tok_events").select("*").order("event_date").order("event_time"),
      sb.from("tok_someday").select("*").order("created_at"),
      sb.from("tok_time_blocks").select("*").order("sort_order"),
      sb.from("tok_todos").select("*").order("start_date"),
    ]);
    const firstError = e1 || e2 || e3 || e5 || e6 || e7;
    if (firstError) { alert("불러오기 실패: " + firstError.message); return; }
    tasks = taskData || [];
    logsToday = new Set((logData || []).map(r => r.habit_id));
    events = eventData || [];
    somedayItems = somedayData || [];
    timeBlocks = blockData || [];
    todos = todoData || [];
    renderHome();
    renderSchedule();
    renderTodo();
  }

  // ── 집 : 진행률 ──
  function renderProgress() {
    const active = tasks.filter(t => t.is_active);
    const doneCount = active.filter(t => logsToday.has(t.id)).length;
    $("homeProgressText").textContent = `오늘 ${doneCount}/${active.length} 완료`;
    $("homeProgressFill").style.width = active.length ? `${Math.round(doneCount/active.length*100)}%` : "0%";
  }

  // ── 집 : 다가오는 일정 ──
  function renderUpcoming() {
    const today = todayStr();
    const upcoming = events.filter(e => e.event_date >= today).slice(0, 5);
    $("upcomingEmpty").style.display = upcoming.length ? "none" : "block";
    $("upcomingCard").style.display = upcoming.length ? "block" : "none";
    $("upcomingCard").innerHTML = upcoming.map(e => `
      <div class="upcoming-row">
        <span class="d">${formatDateShort(e.event_date)}</span>
        <span class="t">${e.event_time ? e.event_time.slice(0,5) : ""}</span>
        <span class="ti">${escapeHtml(e.title)}</span>
      </div>
    `).join("");
  }

  // ── 집 : 오늘의 습관 (목록/타임라인 보기 전환) ──
  function renderHome() {
    renderProgress();
    renderUpcoming();

    const active = tasks.filter(t => t.is_active);
    $("homeEmpty").style.display = active.length ? "none" : "block";

    if (homeView === "timeline") renderHomeTimeline(active);
    else renderHomeBlocks(active);

    renderPlanBoard();

    document.querySelectorAll(".home-check").forEach(cb => {
      cb.onchange = () => toggleToday(cb.dataset.id, cb.checked);
    });

    renderSomeday();
  }

  // 시간이 있는 습관 / 없는 습관으로만 나눔 (시간블럭 개념은 더 이상 화면에 표시하지 않음)
  function splitByTime(active) {
    const timed = active.filter(t => t.start_minute != null).sort((a, b) => a.start_minute - b.start_minute);
    const untimed = active.filter(t => t.start_minute == null);
    return { timed, untimed };
  }

  function untimedListHtml(untimed, label) {
    if (!untimed.length) return "";
    return `
      <div class="tl-unassigned">
        <div class="section-label">${escapeHtml(label)}</div>
        <div class="card">
          ${untimed.map(t => {
            const done = logsToday.has(t.id);
            return `<div class="task-row ${done?'done':''}">
              <input type="checkbox" ${done?"checked":""} data-id="${t.id}" class="home-check" />
              <span>${escapeHtml(t.name)}</span>
            </div>`;
          }).join("")}
        </div>
      </div>`;
  }

  function timedRowHtml(t) {
    const done = logsToday.has(t.id);
    return `<div class="task-row ${done?'done':''}">
      <input type="checkbox" ${done?"checked":""} data-id="${t.id}" class="home-check" />
      <span style="color:var(--sub);font-size:12px;margin-right:6px;">${minutesToHHMM(t.start_minute)}</span>
      <span>${escapeHtml(t.name)}</span>
    </div>`;
  }

  // 타임블럭 보기: tok_time_blocks의 이름표(아침/오전/오후/저녁/밤 등) 구간에 맞춰
  // 시간이 있는 습관을 그룹핑해서 보여줌. block_id 컬럼은 더이상 쓰지 않고,
  // start_minute이 어느 블럭 구간에 들어가는지로 매번 다시 계산함.
  function renderHomeBlocks(active) {
    const { timed, untimed } = splitByTime(active);
    let html = "";

    if (timeBlocks.length) {
      const covered = new Set();
      timeBlocks.forEach(block => {
        const inBlock = timed.filter(t => t.start_minute >= block.start_minute && t.start_minute < block.end_minute);
        inBlock.forEach(t => covered.add(t.id));
        html += `<div class="section-label" style="margin:14px 2px 8px;">${escapeHtml(block.title)}</div>`;
        html += `<div class="card">${inBlock.map(timedRowHtml).join("")}<div class="block-add-row" data-block-start="${block.start_minute}">+ 추가</div></div>`;
      });
      const uncovered = timed.filter(t => !covered.has(t.id));
      if (uncovered.length) {
        html += `<div class="card">${uncovered.map(timedRowHtml).join("")}</div>`;
      }
    } else if (timed.length) {
      // 타임블럭이 하나도 설정 안 돼있으면 그냥 시간순으로만 보여줌
      html += `<div class="card">${timed.map(timedRowHtml).join("")}</div>`;
    }

    $("timelineWrap").innerHTML = html + untimedListHtml(untimed, "시간 없음");

    // 블럭 안 "+ 추가"를 누르면 팝업 없이 바로 그 자리에서 입력할 수 있게 인라인 입력창으로 바뀜.
    // 시작 시각은 블럭 시작시각, 소요시간은 기본 30분(습관 관리 화면에서 나중에 15분 단위로 조절 가능)
    document.querySelectorAll(".block-add-row").forEach(row => {
      row.onclick = () => {
        const startMinute = parseInt(row.dataset.blockStart, 10);
        const wrap = document.createElement("div");
        wrap.className = "block-add-row";
        wrap.innerHTML = `<input type="text" class="inline-add-input" placeholder="습관 이름" />`;
        row.replaceWith(wrap);
        const input = wrap.querySelector("input");
        input.focus();
        let done = false;
        const commit = async () => {
          if (done) return;
          const name = input.value.trim();
          if (!name) { renderHome(); return; }
          done = true;
          const { error } = await sb.from("tok_habits").insert({ name, sort_order: tasks.length, start_minute: startMinute, duration_minutes: 30 });
          if (error) { alert("저장 실패: " + error.message); done = false; return; }
          await loadAll();
        };
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); commit(); }
          else if (e.key === "Escape") { done = true; renderHome(); }
        });
        input.addEventListener("blur", commit);
      };
    });
  }

  // 타임라인 보기: 15분 단위 그리드 위에 습관을 시작 시각·소요시간에 맞춰 배치.
  // 시간블럭 배경 띠는 더 이상 표시하지 않음 — 빈칸을 클릭/드래그하면 그 시각에 바로 습관을 추가할 수 있음.
  const TL_SLOT_MIN = 15;
  const TL_ROW_PX = 13;
  let tlAddState = null;

  function renderHomeTimeline(active) {
    const { timed, untimed } = splitByTime(active);

    let minM = 360, maxM = 1440; // 기본 06:00~24:00
    timed.forEach(t => {
      minM = Math.min(minM, t.start_minute);
      maxM = Math.max(maxM, t.start_minute + (t.duration_minutes || 30));
    });

    const slotCount = Math.max(1, Math.ceil((maxM - minM) / TL_SLOT_MIN));
    const rowOf = (m) => Math.floor((m - minM) / TL_SLOT_MIN) + 1;

    let rowsHtml = "";
    for (let i = 0; i < slotCount; i++) {
      const m = minM + i * TL_SLOT_MIN;
      if (m % 30 === 0) {
        rowsHtml += `<div class="tl-row-line" style="grid-row:${i+1}"></div>`;
        // 30분 눈금선은 다 그리되, 숫자 표시는 정시(매 60분)에만 — 30분 지점은 눈금만 봐도 알 수 있음
        if (m % 60 === 0) {
          rowsHtml += `<div class="tl-row-label" style="grid-row:${i+1}">${minutesToHHMM(m)}</div>`;
        }
      }
    }

    let tasksHtml = "";
    timed.forEach(t => {
      const duration = t.duration_minutes || 30;
      const tStartRow = rowOf(t.start_minute);
      const tEndRow = Math.max(tStartRow + 1, rowOf(t.start_minute + duration));
      const done = logsToday.has(t.id);
      tasksHtml += `<div class="tl-task ${done?'done':''}" data-id="${t.id}" data-start="${t.start_minute}" data-duration="${duration}" style="grid-row:${tStartRow} / ${tEndRow}">
        <div class="tl-handle tl-handle-top"></div>
        <input type="checkbox" ${done?"checked":""} data-id="${t.id}" class="home-check" />
        <span class="tl-title">${escapeHtml(t.name)}</span>
        <div class="tl-handle tl-handle-bottom"></div>
      </div>`;
    });

    $("timelineWrap").innerHTML = `<div class="tl-grid" id="tlGrid" style="grid-template-rows:repeat(${slotCount},${TL_ROW_PX}px)">${rowsHtml}${tasksHtml}</div>${untimedListHtml(untimed, "시간 없음")}`;
    attachTimelineAddDrag(minM, slotCount);
    attachTimelineItemDrag(minM);
  }

  // 기존 습관 항목: 몸통을 짧게 클릭하면 이름 인라인 수정, 0.35초 이상 누르고 있다가 움직이면 이동.
  // 위·아래 손잡이(마우스 올리면 나타남)는 롱프레스 없이 바로 드래그하면 시작/종료(소요시간) 조절.
  // 롱프레스가 시작되기 전에 많이 움직이면(스크롤 등) 이동·수정 둘 다 취소함.
  const TL_LONG_PRESS_MS = 350; // 필요하면 조절 가능(짧으면 오조작, 길면 느리게 느껴짐)

  function attachTimelineItemDrag(minM) {
    const rowOf = (m) => Math.floor((m - minM) / TL_SLOT_MIN) + 1;

    document.querySelectorAll(".tl-task").forEach(task => {
      const id = task.dataset.id;
      if (!id) return; // 인라인 추가 중인 임시 요소는 건너뜀
      const origStart = parseInt(task.dataset.start, 10);
      const origDuration = parseInt(task.dataset.duration, 10);

      let dragKind = null; // null(대기중) | "move" | "resize-top" | "resize-bottom"
      let startY = 0, moved = false, cancelled = false;
      let longPressTimer = null;
      let pendingStart = origStart, pendingDuration = origDuration;

      const applyPreview = () => {
        const sRow = rowOf(pendingStart), eRow = Math.max(sRow + 1, rowOf(pendingStart + pendingDuration));
        task.style.gridRow = `${sRow} / ${eRow}`;
      };
      const clearTimer = () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } };

      const startEditTitle = () => {
        const titleEl = task.querySelector(".tl-title");
        if (!titleEl) return;
        const current = titleEl.textContent;
        const input = document.createElement("input");
        input.type = "text";
        input.className = "inline-add-input";
        input.value = current;
        titleEl.replaceWith(input);
        input.focus(); input.select();
        let done = false;
        const commit = async () => {
          if (done) return;
          const name = input.value.trim();
          if (!name || name === current) { renderHome(); return; }
          done = true;
          const { error } = await sb.from("tok_habits").update({ name }).eq("id", id);
          if (error) { alert("수정 실패: " + error.message); done = false; return; }
          await loadAll();
        };
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); commit(); }
          else if (e.key === "Escape") { done = true; renderHome(); }
        });
        input.addEventListener("blur", commit);
      };

      task.addEventListener("pointerdown", (e) => {
        if (e.target.closest("input")) return;
        const onTop = e.target.closest(".tl-handle-top");
        const onBottom = e.target.closest(".tl-handle-bottom");
        moved = false; cancelled = false;
        pendingStart = origStart; pendingDuration = origDuration;
        startY = e.clientY;
        task.setPointerCapture?.(e.pointerId);

        if (onTop || onBottom) {
          // 손잡이는 마우스를 올려야 보이는 작은 전용 영역이라 롱프레스 없이 바로 조절 시작
          dragKind = onTop ? "resize-top" : "resize-bottom";
        } else {
          // 몸통: 바로 잡지 않고 일정 시간 눌러야 "이동"으로 전환(짧게 떼면 이름 수정)
          dragKind = null;
          longPressTimer = setTimeout(() => {
            longPressTimer = null;
            if (cancelled) return;
            dragKind = "move";
            task.classList.add("dragging");
          }, TL_LONG_PRESS_MS);
        }
      });
      task.addEventListener("pointermove", (e) => {
        const dy = e.clientY - startY;
        if (dragKind === null) {
          // 롱프레스 대기 중에 많이 움직였으면 스크롤 등으로 보고 취소
          if (!cancelled && Math.abs(dy) > 6) { cancelled = true; clearTimer(); }
          return;
        }
        if (Math.abs(dy) > 6) moved = true;
        if (!moved) return;
        const deltaMin = Math.round(dy / TL_ROW_PX) * TL_SLOT_MIN;
        if (dragKind === "move") {
          let ns = origStart + deltaMin;
          ns = Math.max(0, Math.min(1440 - origDuration, ns));
          pendingStart = ns; pendingDuration = origDuration;
        } else if (dragKind === "resize-top") {
          let ns = Math.max(0, Math.min(origStart + origDuration - TL_SLOT_MIN, origStart + deltaMin));
          pendingStart = ns; pendingDuration = (origStart + origDuration) - ns;
        } else {
          let nd = Math.max(TL_SLOT_MIN, Math.min(1440 - origStart, origDuration + deltaMin));
          pendingStart = origStart; pendingDuration = nd;
        }
        applyPreview();
      });
      const finish = async () => {
        clearTimer();
        const kind = dragKind;
        dragKind = null;
        task.classList.remove("dragging");

        if (kind === null) {
          if (!cancelled) startEditTitle(); // 롱프레스 전에 짧게 뗐으면 → 이름 수정
          return;
        }
        if (!moved) return; // 누르기만 하고 움직이지 않았으면 아무 것도 안 함
        const { error } = await sb.from("tok_habits").update({
          start_minute: pendingStart, duration_minutes: pendingDuration,
        }).eq("id", id);
        if (error) { alert((kind === "move" ? "이동" : "시간 조절") + " 실패: " + error.message); }
        await loadAll();
      };
      task.addEventListener("pointerup", finish);
      task.addEventListener("pointercancel", () => { clearTimer(); dragKind = null; task.classList.remove("dragging"); });
    });
  }

  // 타임라인 빈 곳을 클릭하거나 드래그하면 그 시각(또는 드래그한 범위)에 바로 습관 추가 시트가 열림
  function attachTimelineAddDrag(minM, slotCount) {
    const grid = $("tlGrid");
    if (!grid) return;

    const slotFromEvent = (e) => {
      const rect = grid.getBoundingClientRect();
      const y = (e.clientY ?? (e.touches && e.touches[0]?.clientY)) - rect.top;
      const slot = Math.floor(y / TL_ROW_PX);
      return Math.max(0, Math.min(slotCount - 1, slot));
    };

    grid.onpointerdown = (e) => {
      if (e.target.closest(".tl-task")) return; // 기존 항목 위 클릭은 무시(체크박스 등 정상 동작)
      const startSlot = slotFromEvent(e);
      tlAddState = { startSlot, currentSlot: startSlot, minM, moved: false };
      const preview = document.createElement("div");
      preview.className = "tl-add-preview";
      preview.id = "tlAddPreview";
      preview.style.gridRow = `${startSlot+1} / ${startSlot+2}`;
      grid.appendChild(preview);
      grid.setPointerCapture?.(e.pointerId);
    };
    grid.onpointermove = (e) => {
      if (!tlAddState) return;
      const slot = slotFromEvent(e);
      if (slot !== tlAddState.startSlot) tlAddState.moved = true;
      tlAddState.currentSlot = slot;
      const preview = $("tlAddPreview");
      if (preview) {
        const lo = Math.min(tlAddState.startSlot, slot), hi = Math.max(tlAddState.startSlot, slot);
        preview.style.gridRow = `${lo+1} / ${hi+2}`;
      }
    };
    const finish = () => {
      if (!tlAddState) return;
      const { startSlot, currentSlot, moved } = tlAddState;
      const lo = Math.min(startSlot, currentSlot), hi = Math.max(startSlot, currentSlot);
      const startMinute = minM + lo * TL_SLOT_MIN;
      const durationMinutes = moved ? (hi - lo + 1) * TL_SLOT_MIN : 30;
      $("tlAddPreview")?.remove();
      tlAddState = null;
      showTimelineInlineAdd(grid, lo + 1, hi + 2, startMinute, durationMinutes);
    };
    grid.onpointerup = finish;
    grid.onpointercancel = () => { $("tlAddPreview")?.remove(); tlAddState = null; };
  }

  // 팝업 없이 타임라인 그 자리에 바로 입력창을 띄움 (Enter/바깥 클릭 시 저장, Esc면 취소)
  function showTimelineInlineAdd(grid, startRow, endRow, startMinute, durationMinutes) {
    const el = document.createElement("div");
    el.className = "tl-task tl-inline-add";
    el.style.gridRow = `${startRow} / ${endRow}`;
    el.innerHTML = `<input type="text" class="inline-add-input" placeholder="습관 이름" />`;
    grid.appendChild(el);
    const input = el.querySelector("input");
    input.focus();
    let done = false;
    const commit = async () => {
      if (done) return;
      const name = input.value.trim();
      if (!name) { el.remove(); return; }
      done = true;
      const { error } = await sb.from("tok_habits").insert({ name, sort_order: tasks.length, start_minute: startMinute, duration_minutes: durationMinutes });
      if (error) { alert("저장 실패: " + error.message); done = false; return; }
      await loadAll();
    };
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); commit(); }
      else if (e.key === "Escape") { done = true; el.remove(); }
    });
    input.addEventListener("blur", commit);
  }

  // ── 집 : 다가오는 계획 (7일 보드) ──
  // 오늘 칸에는 습관도 함께 보여주고, 나머지 6일은 tok_todos(날짜 있는 1회성 할일)만 보여줌.
  // 빈 날짜를 클릭하면 그 날짜로, 여러 날짜에 걸쳐 세로로 드래그하면 시작~종료 기간으로 할일 추가 시트가 열림.
  function planDayList() {
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date();
      d.setDate(d.getDate() + i);
      days.push(d.toISOString().slice(0, 10));
    }
    return days;
  }

  function renderPlanBoard() {
    const days = planDayList();
    const active = tasks.filter(t => t.is_active);

    $("planBoard").innerHTML = days.map((dateStr, idx) => {
      const dayTodos = todos.filter(td => td.start_date <= dateStr && (td.end_date || td.start_date) >= dateStr);
      const habitHtml = idx === 0 ? active.map(t => {
        const done = logsToday.has(t.id);
        return `<div class="plan-row habit ${done?'done':''}">
          <input type="checkbox" ${done?"checked":""} data-id="${t.id}" class="home-check" />
          <span class="plan-todo-title">${escapeHtml(t.name)}</span>
        </div>`;
      }).join("") : "";
      const todoHtml = dayTodos.map(td => {
        const isRange = td.end_date && td.end_date !== td.start_date;

  let planAddState = null;
  function attachPlanBoardDrag(days) {
    const board = $("planBoard");
    if (!board) return;

    const idxFromPoint = (x, y) => {
      const el = document.elementFromPoint(x, y)?.closest(".plan-day");
      return el ? parseInt(el.dataset.idx, 10) : null;
    };
    const highlight = (a, b) => {
      const lo = Math.min(a, b), hi = Math.max(a, b);
      document.querySelectorAll(".plan-day").forEach(el => {
        const idx = parseInt(el.dataset.idx, 10);
        el.classList.toggle("drag-hi", idx >= lo && idx <= hi);
      });
    };
    const clearHighlight = () => document.querySelectorAll(".plan-day").forEach(el => el.classList.remove("drag-hi"));

    board.onpointerdown = (e) => {
      if (e.target.closest(".plan-todo-check") || e.target.closest(".plan-todo-edit") || e.target.closest(".plan-todo-title") || e.target.closest(".home-check")) return;
      const dayEl = e.target.closest(".plan-day");
      if (!dayEl) return;
      const startIdx = parseInt(dayEl.dataset.idx, 10);
      planAddState = { startIdx, currentIdx: startIdx, moved: false };
      board.setPointerCapture?.(e.pointerId);
      highlight(startIdx, startIdx);
    };
    board.onpointermove = (e) => {
      if (!planAddState) return;
      const idx = idxFromPoint(e.clientX, e.clientY);
      if (idx == null) return;
      if (idx !== planAddState.startIdx) planAddState.moved = true;
      planAddState.currentIdx = idx;
      highlight(planAddState.startIdx, idx);
    };
    const finish = () => {
      if (!planAddState) return;
      const { startIdx, currentIdx, moved } = planAddState;
      const lo = Math.min(startIdx, currentIdx), hi = Math.max(startIdx, currentIdx);
      clearHighlight();
      planAddState = null;
      const dayEl = document.querySelector(`.plan-day[data-idx="${lo}"]`);
      const body = dayEl?.querySelector(".plan-day-body");
      if (body) showPlanInlineAdd(body, days[lo], moved ? days[hi] : null);
    };
    board.onpointerup = finish;
    board.onpointercancel = () => { clearHighlight(); planAddState = null; };
  }

  // 팝업 없이 그 날짜 칸에 바로 입력창을 추가함(기존 항목은 그대로 두고 입력창만 덧붙임)
  function showPlanInlineAdd(body, startDate, endDate) {
    const emptyTag = body.querySelector(".plan-day-empty");
    if (emptyTag) emptyTag.remove();
    const row = document.createElement("div");
    row.className = "plan-inline-add";
    row.innerHTML = `<input type="text" class="inline-add-input" placeholder="할일 제목" />`;
    body.appendChild(row);
    const input = row.querySelector("input");
    input.focus();
    let done = false;
    const commit = async () => {
      if (done) return;
      const title = input.value.trim();
      if (!title) { row.remove(); if (!body.children.length) renderPlanBoard(); return; }
      done = true;
      const { error } = await sb.from("tok_todos").insert({ title, start_date: startDate, end_date: endDate });
      if (error) { alert("저장 실패: " + error.message); done = false; return; }
      await loadAll();
    };
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); commit(); }
      else if (e.key === "Escape") { done = true; row.remove(); if (!body.children.length) renderPlanBoard(); }
    });
    input.addEventListener("blur", commit);
  }

  function formatDateShort(d) {

  function escapeHtml(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  // 오른쪽 클릭(→ PC 관리 메뉴) 공통 헬퍼: 커서 위치에 "삭제" 한 줄짜리 메뉴를 띄움
  function showDeleteMenu(x, y, onDelete) {
    document.querySelector(".ctx-menu")?.remove();
    const menu = document.createElement("div");
    menu.className = "ctx-menu";
    menu.style.left = x + "px";
    menu.style.top = y + "px";
    menu.innerHTML = `<button type="button">삭제</button>`;
    document.body.appendChild(menu);
    menu.querySelector("button").onclick = async (e) => {
      e.stopPropagation();
      menu.remove();
      await onDelete();
    };
    setTimeout(() => {
      const closeOnOutside = (e) => {
        if (!menu.contains(e.target)) {
          menu.remove();
          document.removeEventListener("click", closeOnOutside);
          document.removeEventListener("contextmenu", closeOnOutside);
        }
      };
      document.addEventListener("click", closeOnOutside);
      document.addEventListener("contextmenu", closeOnOutside);
    }, 0);
  }

  boot();
</script>
