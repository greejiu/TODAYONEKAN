<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>오늘한칸</title>
<style>
  :root{
    /* 파스텔 팔레트 */
    --bg:#f6f4fb; --card:#ffffff; --line:#ece6f6; --text:#3d3654; --sub:#9a92ad;
    --accent:#9a8cf0; --accent-soft:#efeaff; --danger:#f2a0a0; --ok:#8fd6b7;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;}

  /* ── 로그인 ── */
  #authBox{max-width:360px;margin:80px auto;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:16px;}
  #authBox h1{font-size:18px;margin:0 0 16px;}
  #authBox input{width:100%;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;font-size:14px;}
  #authBox button{width:100%;padding:10px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;cursor:pointer;margin-top:4px;}
  #authBox .alt{background:none;color:var(--accent);font-size:12px;padding:6px;}
  #authMsg{font-size:12px;color:var(--danger);min-height:16px;margin-top:4px;}

  /* ── 레이아웃 ── */
  #app{display:none;min-height:100vh;}
  .layout{display:flex;min-height:100vh;}
  .sidebar{width:180px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;}
  .sidebar h1{font-size:15px;margin:0 0 20px;padding-left:8px;}
  .navitem{display:flex;align-items:center;gap:8px;padding:10px 8px;border-radius:10px;color:var(--sub);font-size:14px;cursor:pointer;margin-bottom:4px;}
  .navitem.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .content{flex:1;min-width:0;padding:20px 24px 100px;max-width:1100px;}
  .pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .pagehead h2{font-size:18px;margin:0;}
  #logoutBtn{background:none;border:none;color:var(--sub);font-size:12px;cursor:pointer;}

  .bottombar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:10;}
  .bottombar .navitem{flex:1;flex-direction:column;text-align:center;font-size:11px;margin:0;border-radius:0;padding:8px 0;}
  @media (max-width:760px){
    .sidebar{display:none;}
    .bottombar{display:flex;}
    .content{padding:16px 16px 90px;max-width:100%;}
  }

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:50px 0;}
  .section-label{font-size:12px;color:var(--sub);font-weight:700;margin:18px 2px 8px;}
  .section-label:first-child{margin-top:0;}

  /* ── 집 : 진행률 ── */
  .progress-wrap{background:linear-gradient(135deg,#ffe3ee,#e6f3ff 55%,#e3f9ee);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:6px;}
  .progress-text{font-size:14px;color:var(--text);font-weight:600;margin-bottom:8px;}
  .progress-bar{height:8px;background:rgba(255,255,255,.6);border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,#f6a8c7,#9a8cf0);border-radius:999px;transition:width .25s;}

  /* ── 집 : 다가오는 일정 ── */
  .upcoming-row{display:flex;align-items:baseline;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px;}
  .upcoming-row:last-child{border-bottom:none;}
  .upcoming-row .d{color:var(--accent);font-weight:600;flex-shrink:0;font-size:12px;}
  .upcoming-row .t{color:var(--sub);flex-shrink:0;font-size:11px;}
  .upcoming-row .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ── 집 : 습관 목록(행) ── */
  .task-row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);touch-action:none;}
  .task-row:last-child{border-bottom:none;}
  .task-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
  .task-row span{font-size:14px;}
  .task-row.done span{color:var(--sub);text-decoration:line-through;}
  .task-row.dragging{opacity:.5;}
  .block-add-row{padding:10px 4px;color:var(--sub);font-size:13px;text-align:center;cursor:pointer;border-top:1px dashed var(--line);}
  .block-add-row:hover{color:var(--accent);}
  .card.drop-target{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft);}

  /* ── 집 : 목록/타임라인 보기 전환 ── */
  .view-toggle{display:flex;gap:6px;margin-bottom:10px;}
  .view-toggle button{flex:1;padding:8px 0;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:13px;color:var(--sub);cursor:pointer;}
  .view-toggle button.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft);font-weight:600;}

  /* ── 집 : 타임라인 보기(15분 그리드, 습관은 시작시각·소요시간에 맞춰 배치) ── */
  .tl-grid{display:grid;grid-template-columns:44px 1fr;grid-auto-rows:13px;position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 0;overflow:hidden;touch-action:none;}
  .tl-row-label{grid-column:1;font-size:10px;color:var(--sub);text-align:right;padding-right:6px;transform:translateY(-6px);pointer-events:none;}
  .tl-row-line{grid-column:2;border-top:1px solid var(--line);pointer-events:none;}
  .tl-task{grid-column:2;display:flex;align-items:center;gap:6px;background:var(--accent-soft);border:1px solid #dfe3fb;border-radius:8px;margin:1px 8px;padding:0 8px;font-size:12px;position:relative;overflow:hidden;z-index:1;touch-action:none;cursor:pointer;}
  .tl-task.dragging{opacity:.85;box-shadow:0 3px 10px rgba(60,50,100,.18);z-index:5;cursor:grabbing;}
  .tl-task input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;position:relative;z-index:2;}
  .tl-task .tl-title{font-size:12px;flex:1;}
  .tl-task.done .tl-title{color:var(--sub);text-decoration:line-through;}
  /* 위/아래 끝 8px만 즉시 드래그하면 시간 조절(resize) 존 — 마우스 올리면 살짝 표시만, 클릭은 안 뺏음(pointer-events:none) */
  .tl-task::before, .tl-task::after{content:"";position:absolute;left:10px;right:10px;height:2px;border-radius:2px;background:var(--accent);opacity:0;pointer-events:none;transition:opacity .12s;}
  .tl-task::before{top:2px;}
  .tl-task::after{bottom:2px;}
  .tl-task.edge-hover-top::before{opacity:.6;}
  .tl-task.edge-hover-bottom::after{opacity:.6;}
  .tl-add-preview{grid-column:2;background:rgba(154,140,240,.18);border:2px dashed var(--accent);border-radius:8px;margin:0 4px;pointer-events:none;}
  .tl-unassigned{margin-top:10px;}
  .tl-unassigned .section-label{margin:0 2px 8px;}

  /* ── 집 : 언젠가 할일 ── */
  .someday-add-row{display:flex;gap:6px;margin-bottom:8px;}
  .someday-add-row input{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px;}
  .someday-add-row button{padding:0 14px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:13px;cursor:pointer;}
  .someday-row{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px;}
  .someday-row:last-child{border-bottom:none;}
  .someday-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
  .someday-row span{flex:1;}
  .someday-row.done span{color:var(--sub);text-decoration:line-through;}

  /* ── 팝업 없이 바로 입력하는 공통 인라인 추가 스타일 ── */
  .inline-add-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .inline-add-row input{padding:9px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px;font-family:inherit;}
  .inline-add-row input[type=text]{flex:1;min-width:120px;}
  .inline-add-row input[type=date],.inline-add-row input[type=time]{flex:0 0 auto;}
  .inline-add-row input[type=number]{width:64px;flex:0 0 auto;}
  .inline-add-row button{padding:0 14px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:13px;cursor:pointer;flex-shrink:0;}
  .inline-add-input{width:100%;padding:5px 7px;border:1px solid var(--accent);border-radius:6px;font-size:13px;font-family:inherit;background:#fff;}
  .tl-inline-add{padding:0 4px;}
  .tl-inline-add .inline-add-input{padding:2px 6px;font-size:12px;}

  /* ── 클릭=수정, 오른쪽클릭=삭제 메뉴 ── */
  .todo-row .name, .event-row .title, .someday-title, .plan-row.todo .plan-todo-title{cursor:pointer;}
  .todo-row .name:hover, .event-row .title:hover, .someday-title:hover, .plan-row.todo .plan-todo-title:hover{color:var(--accent);}
  .ctx-menu{position:fixed;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:4px;z-index:30;}
  .ctx-menu button{display:block;width:100%;padding:8px 16px;border:none;background:none;color:var(--danger);font-size:13px;text-align:left;cursor:pointer;border-radius:6px;white-space:nowrap;}
  .ctx-menu button:hover{background:var(--bg);}

  /* ── 집 : 2열 레이아웃 (1열 습관 실행, 2열 다가오는 계획+언젠가 할일) ── */
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
  .home-col{min-width:0;}
  @media (max-width:760px){ .home-grid{grid-template-columns:1fr;} }

  /* ── 집 : 오늘/다가오는 계획/언젠가 3열 요약 ── */
  .home-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start;}
  @media (max-width:900px){ .home-grid3{grid-template-columns:1fr;} }
  .agenda-head{display:flex;align-items:center;justify-content:center;gap:10px;}
  .agenda-nav{background:none;border:none;color:var(--sub);cursor:pointer;font-size:13px;padding:2px 8px;border-radius:6px;}
  .agenda-nav:hover{color:var(--accent);background:var(--accent-soft);}
  .agenda-row{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13px;}
  .agenda-row:last-child{border-bottom:none;}
  .agenda-row.done{opacity:.5;text-decoration:line-through;}
  .ag-allday-row{touch-action:none;cursor:pointer;}
  .ag-allday-row.dragging{opacity:.5;}
  .ag-tl-grid.drop-target{outline:2px dashed var(--accent);outline-offset:-2px;}
  #agendaAllDayZone.drop-target{outline:2px dashed var(--accent);outline-offset:-2px;border-radius:14px;}
  #somedayZone.drop-target{outline:2px dashed var(--accent);outline-offset:-2px;border-radius:14px;}
  .planup-day.drop-target{background:var(--accent-soft);border-radius:8px;}
  .ag-someday-row{cursor:grab;}
  .ag-someday-row.dragging{cursor:grabbing;}
  .agenda-time{color:var(--sub);font-size:12px;width:36px;flex-shrink:0;}
  .agenda-tag{font-size:10px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;flex-shrink:0;}
  .agenda-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ── 집 : 오늘 열의 타임블럭/타임라인(습관+일정 통합, 드래그로 이동/조절 가능) ── */
  .ag-tl-grid{display:grid;grid-template-columns:34px 1fr;grid-auto-rows:13px;position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 0;overflow:hidden;}
  /* 같은 시간대에 겹치는 항목을 나란히 배치하려고 grid-row 대신 이 안에서 절대좌표(top/left/width)로 배치함 */
  .ag-tl-content{grid-column:2;grid-row:1 / -1;position:relative;}
  .ag-tl-task{display:flex;align-items:center;gap:6px;background:var(--accent-soft);border:1px solid #dfe3fb;border-radius:8px;padding:0 6px;font-size:12px;position:absolute;box-sizing:border-box;overflow:hidden;z-index:1;touch-action:none;cursor:pointer;}
  .ag-tl-task.done{opacity:.55;text-decoration:line-through;}
  .ag-tl-task.event{background:#fff;border-style:dashed;}
  .ag-tl-task.dragging{opacity:.85;box-shadow:0 3px 10px rgba(60,50,100,.18);z-index:5;cursor:grabbing;}
  .ag-tl-task .ag-tl-title{font-size:12px;flex:1;}
  .ag-tl-task::before, .ag-tl-task::after{content:"";position:absolute;left:10px;right:10px;height:2px;border-radius:2px;background:var(--accent);opacity:0;pointer-events:none;transition:opacity .12s;}
  .ag-tl-task::before{top:2px;}
  .ag-tl-task::after{bottom:2px;}
  .ag-tl-task.edge-hover-top::before{opacity:.6;}
  .ag-tl-task.edge-hover-bottom::after{opacity:.6;}

  /* ── 집 : 다가오는 계획 (7일 보드, 습관 탭의 #planBoard와는 별도 인스턴스) ── */
  .planup-day{padding:8px 4px;border-bottom:1px solid var(--line);touch-action:none;}
  .planup-day:last-child{border-bottom:none;}
  .planup-day.drag-hi{background:var(--accent-soft);border-radius:8px;}
  .planup-day-label{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:4px;}
  .planup-day-body{display:flex;flex-direction:column;gap:4px;}
  .planup-day-empty{font-size:12px;color:var(--sub);opacity:.5;padding:4px 0;}

  /* ── 집 : 다가오는 계획 (7일 보드) ── */
  .plan-day{padding:8px 4px;border-bottom:1px solid var(--line);touch-action:none;}
  .plan-day:last-child{border-bottom:none;}
  .plan-day.drag-hi{background:var(--accent-soft);border-radius:8px;}
  .plan-day-label{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:4px;}
  .plan-day-body{display:flex;flex-direction:column;gap:4px;}
  .plan-row{display:flex;align-items:center;gap:6px;font-size:13px;padding:2px 0;}
  .plan-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
  .plan-row.done .plan-todo-title{color:var(--sub);text-decoration:line-through;}
  .plan-row.habit{color:var(--accent);}
  .planup-drag-row{touch-action:none;cursor:grab;}
  .planup-drag-row.dragging{opacity:.5;cursor:grabbing;}
  .plan-todo-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .plan-range-tag{font-size:10px;color:var(--sub);flex-shrink:0;}
  .plan-todo-edit{border:none;background:none;color:var(--sub);font-size:12px;cursor:pointer;flex-shrink:0;padding:2px 4px;}
  .plan-day-empty{font-size:12px;color:var(--sub);opacity:.5;padding:4px 0;}

  /* ── 일정 화면 ── */
  .day-group{margin-bottom:14px;}
  .day-label{font-size:12px;color:var(--sub);margin:0 0 6px 2px;font-weight:600;}
  .event-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);}
  .event-row:last-child{border-bottom:none;}
  .event-row .t{font-size:12px;color:var(--sub);width:48px;flex-shrink:0;}
  .event-row .body{flex:1;min-width:0;}
  .event-row .title{font-size:14px;}
  .event-row .memo{font-size:12px;color:var(--sub);margin-top:2px;}
  .event-row .del{border:none;background:none;color:var(--danger);font-size:12px;cursor:pointer;flex-shrink:0;}

  /* ── 습관 관리 화면 ── */
  .todo-row{display:flex;align-items:center;gap:8px;padding:12px 4px;border-bottom:1px solid var(--line);}
  .todo-row:last-child{border-bottom:none;}
  .todo-row .info{flex:1;min-width:0;}
  .todo-row .name{font-size:14px;}
  .todo-row .block-tag{font-size:11px;color:var(--sub);}
  .todo-row.inactive .name{color:var(--sub);}
  .togglebtn{border:1px solid var(--line);background:#fff;border-radius:999px;font-size:11px;padding:4px 10px;cursor:pointer;color:var(--sub);flex-shrink:0;}
  .togglebtn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft);}
  .del{border:none;background:none;color:var(--danger);font-size:12px;cursor:pointer;flex-shrink:0;}
  .settingsbtn{border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12px;width:26px;height:26px;line-height:1;cursor:pointer;color:var(--sub);flex-shrink:0;}
  .habit-cat-chip{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:10px;color:#fff;}

  .fab{position:fixed;right:20px;bottom:24px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:26px;box-shadow:0 6px 16px rgba(154,140,240,.4);cursor:pointer;z-index:8;}
  @media (max-width:760px){ .fab{bottom:78px;} }

  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:20;}
  .sheet-bg.open{display:flex;}
  .sheet{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 16px 24px;max-height:88vh;overflow-y:auto;}
  .sheet h2{font-size:15px;margin:0 0 12px;}
  .field{margin-bottom:10px;}
  .field label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px;}
  .field input, .field textarea, .field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;}
  .field.split{display:flex;gap:8px;}
  .field.split > div{flex:1;}
  .sheet-actions{display:flex;gap:8px;margin-top:14px;}
  .sheet-actions button{flex:1;padding:11px;border-radius:10px;border:none;font-size:14px;cursor:pointer;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-ghost{background:var(--bg);color:var(--sub);}
</style>
</head>
<body>

<div id="authBox">
  <h1>오늘한칸</h1>
  <div id="authMsg"></div>
  <input id="authEmail" type="email" placeholder="이메일" autocomplete="username" />
  <input id="authPw" type="password" placeholder="비밀번호 (8자 이상)" autocomplete="current-password" />
  <button id="loginBtn">로그인</button>
  <button id="signupBtn" class="alt">계정이 없다면 회원가입</button>
</div>

<div id="app">
  <div class="layout">
    <div class="sidebar">
      <h1>오늘한칸</h1>
      <div class="navitem" data-page="home">🏠 집</div>
      <div class="navitem" data-page="schedule">📅 일정</div>
      <div class="navitem" data-page="todos">✓ 할일</div>
      <div class="navitem" data-page="todo">⟳ 습관</div>
      <div style="margin-top:20px;"><button id="logoutBtn">로그아웃</button></div>
    </div>

    <div class="content">
      <!-- 집 -->
      <div class="page" data-page="home">
        <div class="pagehead"><h2>🏠 집</h2></div>

        <div class="progress-wrap">
          <div class="progress-text" id="homeProgressText">오늘 0/0 완료</div>
          <div class="progress-bar"><div class="progress-fill" id="homeProgressFill" style="width:0%"></div></div>
        </div>

        <div class="home-grid3">
          <div class="home-col">
            <div class="section-label agenda-head">
              <button id="agendaPrevBtn" class="agenda-nav">◀</button>
              <span id="agendaDateLabel" style="cursor:pointer;">오늘</span>
              <button id="agendaNextBtn" class="agenda-nav">▶</button>
            </div>

            <div class="view-toggle" style="margin-top:10px;">
              <button id="agendaViewBlockBtn" class="active">타임블럭</button>
              <button id="agendaViewTimelineBtn">타임라인</button>
            </div>

            <div class="section-label" style="margin-top:10px;font-size:12px;">하루종일</div>
            <div id="agendaAllDayZone">
              <div class="card" id="agendaAllDayList"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  // ── Supabase 설정 (그리지우 프로젝트, tok_ 접두사 테이블 사용) ──
  const SUPABASE_URL = "https://mmpsyajgyufdxmmnxqba.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_odr6eVpfut1PbfGcG9vDYQ_pKEVFggA";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = (id) => document.getElementById(id);
  // UTC 기준(toISOString)이 아니라 사용자 로컬 시간 기준으로 "오늘" 날짜를 계산 (자정 근처 한국시간 오차 방지)
  const todayStr = () => {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  };
  const pad2 = (n) => String(n).padStart(2, "0");
  const minutesToHHMM = (m) => `${pad2(Math.floor(m/60) % 24)}:${pad2(m%60)}`;

  let tasks = [];
  let logsToday = new Set(); // habit_id set, 오늘 완료된 것
  let events = [];
  let somedayItems = [];
  let timeBlocks = []; // tok_time_blocks: 타임블럭 탭의 이름표 그룹핑용
  let todos = []; // tok_todos: 다가오는 계획 보드용 (날짜 있는 1회성 할일)
  let habitCategories = []; // tok_habit_categories: 습관 카테고리(1단계, 이름+색상)
  let currentPage = "home";
  let homeView = "list"; // "list" | "timeline"

  // ── 인증 ──
  $("loginBtn").onclick = async () => {
    const email = $("authEmail").value.trim();
    const password = $("authPw").value;
    $("authMsg").textContent = "";
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { $("authMsg").textContent = error.message; return; }
    await boot();
  };
  $("signupBtn").onclick = async () => {
    const email = $("authEmail").value.trim();
    const password = $("authPw").value;
    $("authMsg").textContent = "";
    if (password.length < 8) { $("authMsg").textContent = "비밀번호는 8자 이상이어야 해요."; return; }
    const { error } = await sb.auth.signUp({ email, password });
    if (error) { $("authMsg").textContent = error.message; return; }
    $("authMsg").style.color = "var(--ok)";
    $("authMsg").textContent = "가입 완료! 로그인 버튼을 눌러주세요.";
  };
  $("logoutBtn").onclick = async () => { await sb.auth.signOut(); location.reload(); };

  async function boot() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return;
    $("authBox").style.display = "none";
    $("app").style.display = "block";
    await loadAll();
    showPage("home");
  }

  // ── 네비게이션 ──
  document.querySelectorAll(".navitem").forEach(el => {
    el.onclick = () => showPage(el.dataset.page);
  });
  function showPage(page) {
    currentPage = page;
    document.querySelectorAll(".navitem").forEach(el => el.classList.toggle("active", el.dataset.page === page));
    document.querySelectorAll(".page").forEach(el => el.style.display = el.dataset.page === page ? "block" : "none");
  }

  // ── 데이터 로드 ──
  async function loadAll() {
    const [
      { data: taskData, error: e1 },
      { data: logData, error: e2 },
      { data: eventData, error: e3 },
      { data: somedayData, error: e5 },
      { data: blockData, error: e6 },
      { data: todoData, error: e7 },
      { data: habitCatData, error: e8 },
    ] = await Promise.all([
      sb.from("tok_habits").select("*").order("start_minute", { nullsFirst: false }).order("created_at"),
      sb.from("tok_habit_logs").select("habit_id").eq("done_date", todayStr()),
      sb.from("tok_events").select("*").order("event_date").order("event_time"),
      sb.from("tok_someday").select("*").order("created_at"),
      sb.from("tok_time_blocks").select("*").order("sort_order"),
      sb.from("tok_todos").select("*").order("start_date"),
      sb.from("tok_habit_categories").select("*").order("sort_order"),
    ]);
    const firstError = e1 || e2 || e3 || e5 || e6 || e7 || e8;
    if (firstError) { alert("불러오기 실패: " + firstError.message); return; }
    tasks = taskData || [];
    logsToday = new Set((logData || []).map(r => r.habit_id));
    events = eventData || [];
    somedayItems = somedayData || [];
    timeBlocks = blockData || [];
    todos = todoData || [];
    habitCategories = habitCatData || [];
    renderHome();
    renderSchedule();
    renderTodosPage();
    renderTodo();
  }

  // ── 집 : 진행률 ──
  function renderProgress() {
    const active = tasks.filter(t => t.is_active);
    const doneCount = active.filter(t => logsToday.has(t.id)).length;
    $("homeProgressText").textContent = `오늘 ${doneCount}/${active.length} 완료`;
    $("homeProgressFill").style.width = active.length ? `${Math.round(doneCount/active.length*100)}%` : "0%";
  }

  // ── 집 : 오늘 한눈에 보기(2026-09-05 재개편 — 다가오는 일정 카드 제거, 오늘 열에 습관도 통합) ──
  function renderHome() {
    renderProgress();
    renderAgendaAllDay();
    renderAgendaTimed();
    renderPlanUpcomingBoard();
    renderSomedaySummary();
  }

  function addDaysStr(dateStr, delta) {
    // toISOString()으로 변환하면 한국 시간(UTC+9)에서 날짜가 하루 어긋나므로 로컬 필드로 직접 조립
    const dt = new Date(dateStr + "T00:00:00");
    dt.setDate(dt.getDate() + delta);
    const y = dt.getFullYear();
    const m = String(dt.getMonth() + 1).padStart(2, "0");
    const day = String(dt.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }
  function hhmmToMinutes(hhmm) {
    const [h, m] = hhmm.split(":").map(Number);
    return h * 60 + (m || 0);
  }

  let homeAgendaDate = todayStr();
  let agendaView = "block"; // "block" | "timeline" — 오늘 열 전용(습관탭의 homeView와는 별개 상태)

  // 습관은 매일 반복이라 날짜별 완료 여부만 다름. 오늘이면 이미 있는 logsToday를 그대로 씀.
  async function fetchLogsForDate(dateStr) {
    if (dateStr === todayStr()) return new Set(logsToday);
    const { data, error } = await sb.from("tok_habit_logs").select("habit_id").eq("done_date", dateStr);
    if (error) return new Set();
    return new Set((data || []).map(r => r.habit_id));
  }

  // 습관 체크를 "오늘"이 아닌 다른 날짜(과거·미래)에도 할 수 있게 일반화한 버전.
  async function toggleHabitForDate(taskId, checked, dateStr) {
    if (checked) {
      const { error } = await sb.from("tok_habit_logs").insert({ habit_id: taskId, done_date: dateStr });
      if (error) { alert("체크 실패: " + error.message); return; }
    } else {
      const { error } = await sb.from("tok_habit_logs").delete().eq("habit_id", taskId).eq("done_date", dateStr);
      if (error) { alert("체크 해제 실패: " + error.message); return; }
    }
    if (dateStr === todayStr()) {
      if (checked) logsToday.add(taskId); else logsToday.delete(taskId);
      renderTodo();
    }
    if (homeAgendaDate === dateStr) await renderAgendaTimed();
    await renderPlanUpcomingBoard();
  }
  async function toggleToday(taskId, checked) {
    await toggleHabitForDate(taskId, checked, todayStr());
  }

  // "하루종일": 그 날짜에 걸친 할일(시간 없음) + 시간 없는 일정 + 시간 없는 습관
  async function renderAgendaAllDay() {
    const dateStr = homeAgendaDate;
    $("agendaDateLabel").textContent = formatDate(dateStr);
    const dayTodos = todos.filter(td => td.start_date <= dateStr && (td.end_date || td.start_date) >= dateStr && !td.todo_time);
    const dayUntimedEvents = events.filter(e => e.event_date === dateStr && !e.event_time);
    const untimedHabits = tasks.filter(t => t.is_active && t.start_minute == null);
    const doneSet = untimedHabits.length ? await fetchLogsForDate(dateStr) : new Set();

    const rows = [
      ...dayUntimedEvents.map(e => `
        <div class="agenda-row ag-allday-row" data-id="${e.id}" data-kind="event">
          <span class="agenda-tag">일정</span>
          <span class="agenda-title">${escapeHtml(e.title)}</span>
        </div>`),
      ...untimedHabits.map(t => `
        <div class="agenda-row ag-allday-row ${doneSet.has(t.id) ? "done" : ""}" data-id="${t.id}" data-kind="habit">
          <input type="checkbox" ${doneSet.has(t.id) ? "checked" : ""} data-id="${t.id}" data-date="${dateStr}" class="ag-habit-check" />
          <span class="agenda-tag">습관</span>
          <span class="agenda-title">${escapeHtml(t.name)}</span>
        </div>`),
      ...dayTodos.map(td => `
        <div class="agenda-row ag-allday-row ${td.is_done ? "done" : ""}" data-id="${td.id}" data-kind="todo">
          <input type="checkbox" ${td.is_done ? "checked" : ""} data-id="${td.id}" class="agenda-todo-check" />
          <span class="agenda-tag">할일</span>
          <span class="agenda-title">${escapeHtml(td.title)}</span>
        </div>`),
    ];
    $("agendaAllDayList").innerHTML = rows.join("");
    $("agendaAllDayEmpty").style.display = rows.length ? "none" : "block";

    document.querySelectorAll(".agenda-todo-check").forEach(cb => {
      cb.onchange = async () => {
        const { error } = await sb.from("tok_todos").update({ is_done: cb.checked }).eq("id", cb.dataset.id);
        if (error) { alert("변경 실패: " + error.message); return; }
        const t = todos.find(x => x.id === cb.dataset.id);
        if (t) t.is_done = cb.checked;
        renderAgendaAllDay();
        renderPlanUpcomingBoard();
      };
    });
    wireAgendaHabitChecks();
    attachAgendaAllDayDrag();
  }

  // 집 페이지 3열(언젠가 / 다가오는 계획 / 오늘의 하루종일·타임블럭·타임라인) 전체를 아우르는
  // 드래그 대상 판별 + 실제 이동 처리. 세 열 중 어디서 집어 어디에 놓든 같은 방식으로 처리됨.
  //   zone 종류: "someday"(날짜 없음) / "planday"(다가오는 계획의 특정 날짜) / "today-allday"(오늘, 시간 없음) / "today-timed"(오늘, 특정 시각)
  function homeDropZone(x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const planDay = el.closest(".planup-day[data-idx]");
    if (planDay) {
      const date = homePlanDays[parseInt(planDay.dataset.idx, 10)];
      return date ? { zone: "planday", date } : null;
    }
    const blockCard = el.closest(".ag-block-card[data-block-start]");
    if (blockCard) return { zone: "today-timed", startMinute: parseInt(blockCard.dataset.blockStart, 10) };
    const tlContent = el.closest(".ag-tl-content");
    if (tlContent) {
      const rect = tlContent.getBoundingClientRect();
      const slot = Math.max(0, Math.floor((y - rect.top) / AG_TL_ROW_PX));
      return { zone: "today-timed", startMinute: agendaTimelineMinM + slot * AG_TL_SLOT_MIN };
    }
    if (el.closest("#agendaAllDayZone")) return { zone: "today-allday" };
    if (el.closest("#somedayZone")) return { zone: "someday" };
    return null;
  }
  let agendaTimelineMinM = 360; // renderAgendaTimeline이 매번 갱신(타임라인 뷰 드롭 위치→시각 계산용)
  let homePlanDays = [];        // renderPlanUpcomingBoard가 매번 갱신(다가오는 계획 칸 idx→날짜 계산용)

  // kind: "habit" | "event" | "todo" | "someday"(아직 날짜 없는 언젠가 항목) 소스를 zone으로 옮김.
  // 습관은 날짜 개념이 없어 오늘(하루종일/시간) 두 zone만 적용되고 나머지는 무시(아무 일도 안 일어남).
  // 언젠가⇄할일은 테이블 자체가 달라서(tok_someday ↔ tok_todos) 새로 만들고 지우는 방식으로 옮김.
  async function moveItemToZone(kind, id, zoneObj) {
    if (!zoneObj) return;
    const zone = zoneObj.zone;
    if (kind === "habit") {
      if (zone === "today-allday") {
        const { error } = await sb.from("tok_habits").update({ start_minute: null }).eq("id", id);
        if (error) { alert("이동 실패: " + error.message); return; }
      } else if (zone === "today-timed") {
        const { error } = await sb.from("tok_habits").update({ start_minute: zoneObj.startMinute }).eq("id", id);
        if (error) { alert("이동 실패: " + error.message); return; }
      } else {
        return; // 습관은 언젠가/다가오는 계획 날짜로는 옮길 수 없음(매일 반복이라 날짜 소속이 아님)
      }
    } else if (kind === "event") {
      if (zone === "someday") return; // 일정은 고정 스케줄 개념이라 언젠가로는 전환하지 않음
      const patch = zone === "planday" ? { event_date: zoneObj.date }
        : zone === "today-allday" ? { event_date: todayStr(), event_time: null }
        : { event_date: todayStr(), event_time: minutesToHHMM(zoneObj.startMinute) + ":00" };
      const { error } = await sb.from("tok_events").update(patch).eq("id", id);
      if (error) { alert("이동 실패: " + error.message); return; }
    } else if (kind === "todo") {
      if (zone === "someday") {
        const t = todos.find(x => x.id === id);
        if (!t) return;
        const { error: insErr } = await sb.from("tok_someday").insert({ title: t.title, is_done: t.is_done });
        if (insErr) { alert("이동 실패: " + insErr.message); return; }
        const { error: delErr } = await sb.from("tok_todos").delete().eq("id", id);
        if (delErr) { alert("이동 실패: " + delErr.message); return; }
      } else {
        const patch = zone === "planday" ? { start_date: zoneObj.date, end_date: null }
          : zone === "today-allday" ? { start_date: todayStr(), end_date: null, todo_time: null }
          : { start_date: todayStr(), end_date: null, todo_time: minutesToHHMM(zoneObj.startMinute) + ":00" };
        const { error } = await sb.from("tok_todos").update(patch).eq("id", id);
        if (error) { alert("이동 실패: " + error.message); return; }
      }
    } else if (kind === "someday") {
      if (zone === "someday") return; // 이미 언젠가라 놓아도 변화 없음
      const s = somedayItems.find(x => x.id === id);
      if (!s) return;
      const patch = { title: s.title, is_done: s.is_done, end_date: null };
      if (zone === "planday") patch.start_date = zoneObj.date;
      else if (zone === "today-allday") patch.start_date = todayStr();
      else { patch.start_date = todayStr(); patch.todo_time = minutesToHHMM(zoneObj.startMinute) + ":00"; }
      const { error: insErr } = await sb.from("tok_todos").insert(patch);
      if (insErr) { alert("이동 실패: " + insErr.message); return; }
      const { error: delErr } = await sb.from("tok_someday").delete().eq("id", id);
      if (delErr) { alert("이동 실패: " + delErr.message); return; }
    }
    await loadAll();
  }

  function attachAgendaAllDayDrag() {
    let dragEl = null, dragId = null, dragKindAttr = null, moved = false, startX = 0, startY = 0, curTarget = null;

    document.querySelectorAll(".ag-allday-row[data-id]").forEach(row => {
      row.addEventListener("pointerdown", (e) => {
        if (e.target.closest("input")) return;
        dragEl = row; dragId = row.dataset.id; dragKindAttr = row.dataset.kind; moved = false; curTarget = null;
        startX = e.clientX; startY = e.clientY;
        row.setPointerCapture?.(e.pointerId);
      });
      row.addEventListener("pointermove", (e) => {
        if (!dragEl) return;
        if (!moved && Math.hypot(e.clientX - startX, e.clientY - startY) > 8) {
          moved = true;
          dragEl.classList.add("dragging");
        }
        if (!moved) return;
        const drop = homeDropZone(e.clientX, e.clientY);
        const under = drop && drop.zone !== "today-allday" ? document.elementFromPoint(e.clientX, e.clientY)?.closest(".ag-block-card, .ag-tl-grid, .planup-day, #somedayZone") : null;
        if (under !== curTarget) {
          curTarget?.classList.remove("drop-target");
          curTarget = under || null;
          curTarget?.classList.add("drop-target");
        }
      });
      const finish = async (e) => {
        if (!dragEl) return;
        const el = dragEl, id = dragId, kind = dragKindAttr, wasMoved = moved;
        dragEl = null; dragId = null; dragKindAttr = null; moved = false;
        el.classList.remove("dragging");
        curTarget?.classList.remove("drop-target");
        curTarget = null;
        if (!wasMoved) return;
        const drop = homeDropZone(e.clientX, e.clientY);
        if (!drop || drop.zone === "today-allday") return; // 이미 하루종일이라 놓아도 변화 없음
        await moveItemToZone(kind, id, drop);
      };
      row.addEventListener("pointerup", finish);
      row.addEventListener("pointercancel", () => {
        dragEl?.classList.remove("dragging");
        curTarget?.classList.remove("drop-target");
        dragEl = null; dragId = null; dragKindAttr = null; moved = false; curTarget = null;
      });
    });
  }

  // 선택한 날짜의 "시간 있는" 항목만 모음: 습관(항상 매일 반복) + 시간 있는 일정 + 시간 지정된 할일.
  // 시간 없는 할일은 하루종일에만 나옴.
  async function timedItemsForDate(dateStr) {
    const doneSet = await fetchLogsForDate(dateStr);
    const active = tasks.filter(t => t.is_active && t.start_minute != null);
    const habitItems = active.map(t => ({
      kind: "habit", id: t.id, name: t.name,
      start_minute: t.start_minute, duration_minutes: t.duration_minutes || 30,
      done: doneSet.has(t.id),
    }));
    const dayEvents = events.filter(e => e.event_date === dateStr && e.event_time);
    const eventItems = dayEvents.map(e => ({
      kind: "event", id: e.id, name: e.title,
      start_minute: hhmmToMinutes(e.event_time), duration_minutes: 30, done: false,
    }));
    const dayTimedTodos = todos.filter(td => td.todo_time && td.start_date <= dateStr && (td.end_date || td.start_date) >= dateStr);
    const todoItems = dayTimedTodos.map(td => ({
      kind: "todo", id: td.id, name: td.title,
      start_minute: hhmmToMinutes(td.todo_time.slice(0, 5)), duration_minutes: 30, done: td.is_done,
    }));
    return [...habitItems, ...eventItems, ...todoItems].sort((a, b) => a.start_minute - b.start_minute);
  }

  async function renderAgendaTimed() {
    const items = await timedItemsForDate(homeAgendaDate);
    if (agendaView === "timeline") renderAgendaTimeline(items);
    else renderAgendaBlocks(items);
  }

  // 오늘 열의 타임블럭/타임라인은 보기+체크 전용(드래그 이동·조절은 습관 탭에서). 일정은 표시만.
  function agendaItemRowHtml(it) {
    return `<div class="task-row ag-block-row ${it.done ? "done" : ""}" data-id="${it.id}" data-kind="${it.kind}">
      ${it.kind === "habit"
        ? `<input type="checkbox" ${it.done ? "checked" : ""} data-id="${it.id}" data-date="${homeAgendaDate}" class="ag-habit-check" />`
        : it.kind === "todo"
        ? `<input type="checkbox" ${it.done ? "checked" : ""} data-id="${it.id}" class="ag-todo-check" />`
        : `<span class="agenda-tag">일정</span>`}
      <span style="color:var(--sub);font-size:12px;margin-right:6px;">${minutesToHHMM(it.start_minute)}</span>
      <span>${escapeHtml(it.name)}</span>
    </div>`;
  }

  function renderAgendaBlocks(items) {
    let html = "";
    if (timeBlocks.length) {
      const covered = new Set();
      timeBlocks.forEach(block => {
        const inBlock = items.filter(it => it.start_minute >= block.start_minute && it.start_minute < block.end_minute);
        inBlock.forEach(it => covered.add(it));
        html += `<div class="section-label" style="margin:14px 2px 8px;">${escapeHtml(block.title)}</div>`;
        html += `<div class="card ag-block-card" data-block-start="${block.start_minute}">${inBlock.map(agendaItemRowHtml).join("")}</div>`;
      });
      const uncovered = items.filter(it => !covered.has(it));
      if (uncovered.length) html += `<div class="card">${uncovered.map(agendaItemRowHtml).join("")}</div>`;
    } else if (items.length) {
      html += `<div class="card">${items.map(agendaItemRowHtml).join("")}</div>`;
    }
    $("agendaTimeWrap").innerHTML = html || `<div class="empty" style="padding:20px 0;font-size:12px;">시간이 있는 항목이 없어요.</div>`;
    wireAgendaHabitChecks();
    attachAgendaBlockDrag();
  }

  // 오늘 열 타임블럭(카드형) 보기: 습관·일정 행을 다른 블럭 카드 위로 드래그하면
  // 그 블럭의 시작 시각으로 재배정됨(습관 탭 attachBlockDrag와 동일 패턴, 습관+일정 공용으로 일반화).
  function attachAgendaBlockDrag() {
    let dragEl = null, dragId = null, dragKindAttr = null, moved = false, startX = 0, startY = 0, curTarget = null;

    document.querySelectorAll(".ag-block-row[data-id]").forEach(row => {
      row.addEventListener("pointerdown", (e) => {
        if (e.target.closest("input")) return;
        dragEl = row; dragId = row.dataset.id; dragKindAttr = row.dataset.kind; moved = false; curTarget = null;
        startX = e.clientX; startY = e.clientY;
        row.setPointerCapture?.(e.pointerId);
      });
      row.addEventListener("pointermove", (e) => {
        if (!dragEl) return;
        if (!moved && Math.hypot(e.clientX - startX, e.clientY - startY) > 8) {
          moved = true;
          dragEl.classList.add("dragging");
        }
        if (!moved) return;
        const under = document.elementFromPoint(e.clientX, e.clientY)?.closest(".ag-block-card[data-block-start], #agendaAllDayZone, .planup-day, #somedayZone");
        if (under !== curTarget) {
          curTarget?.classList.remove("drop-target");
          curTarget = under || null;
          curTarget?.classList.add("drop-target");
        }
      });
      const finish = async (e) => {
        if (!dragEl) return;
        const el = dragEl, id = dragId, kind = dragKindAttr, wasMoved = moved;
        dragEl = null; dragId = null; dragKindAttr = null; moved = false;
        el.classList.remove("dragging");
        curTarget?.classList.remove("drop-target");
        curTarget = null;
        if (!wasMoved) return;
        const drop = homeDropZone(e.clientX, e.clientY);
        await moveItemToZone(kind, id, drop);
      };
      row.addEventListener("pointerup", finish);
      row.addEventListener("pointercancel", () => {
        dragEl?.classList.remove("dragging");
        curTarget?.classList.remove("drop-target");
        dragEl = null; dragId = null; dragKindAttr = null; moved = false; curTarget = null;
      });
    });
  }

  const AG_TL_SLOT_MIN = 15, AG_TL_ROW_PX = 13;
  function renderAgendaTimeline(items) {
    let minM = 360, maxM = 1440;
    items.forEach(it => {
      minM = Math.min(minM, it.start_minute);
      maxM = Math.max(maxM, it.start_minute + it.duration_minutes);
    });
    agendaTimelineMinM = minM; // 하루종일→타임라인 드래그 드롭시 시각 계산에 씀
    const slotCount = Math.max(1, Math.ceil((maxM - minM) / AG_TL_SLOT_MIN));
    const rowOf = (m) => Math.floor((m - minM) / AG_TL_SLOT_MIN) + 1;

    let rowsHtml = "";
    for (let i = 0; i < slotCount; i++) {
      const m = minM + i * AG_TL_SLOT_MIN;
      if (m % 30 === 0) {
        rowsHtml += `<div class="tl-row-line" style="grid-row:${i+1}"></div>`;
        if (m % 60 === 0) rowsHtml += `<div class="tl-row-label" style="grid-row:${i+1}">${minutesToHHMM(m)}</div>`;
      }
    }
    // 같은 시간대에 겹치는 항목은 나란히 배치(2개 겹치면 2열, 3개면 3열 …) — 겹치는 묶음(cluster) 단위로
    // 그 묶음 안 최대 동시 개수만큼 열을 나눔(캘린더 앱들이 흔히 쓰는 구간 색칠 방식).
    const placements = agendaTimelineLayout(items);

    let itemsHtml = "";
    placements.forEach(({ item: it, col, colCount }) => {
      const sRow = rowOf(it.start_minute), eRow = Math.max(sRow + 1, rowOf(it.start_minute + it.duration_minutes));
      const top = (sRow - 1) * AG_TL_ROW_PX;
      const height = (eRow - sRow) * AG_TL_ROW_PX;
      const widthPct = 100 / colCount;
      const leftPct = widthPct * col;
      itemsHtml += `<div class="ag-tl-task ${it.kind} ${it.done ? "done" : ""}" data-id="${it.id}" data-kind="${it.kind}" data-start="${it.start_minute}" data-duration="${it.duration_minutes}" style="top:${top}px;height:${height}px;left:${leftPct}%;width:calc(${widthPct}% - 4px);">
        ${it.kind === "habit"
          ? `<input type="checkbox" ${it.done ? "checked" : ""} data-id="${it.id}" data-date="${homeAgendaDate}" class="ag-habit-check" />`
          : it.kind === "todo"
          ? `<input type="checkbox" ${it.done ? "checked" : ""} data-id="${it.id}" class="ag-todo-check" />`
          : `<span class="agenda-tag">일정</span>`}
        <span class="ag-tl-title">${escapeHtml(it.name)}</span>
      </div>`;
    });
    $("agendaTimeWrap").innerHTML = `<div class="ag-tl-grid" style="grid-template-rows:repeat(${slotCount},${AG_TL_ROW_PX}px)">${rowsHtml}<div class="ag-tl-content">${itemsHtml}</div></div>`;
    wireAgendaHabitChecks();
    attachAgendaTimelineItemDrag(minM);
  }

  // 시간이 겹치는 항목끼리 열(column)을 나눠 배정. 겹치는 구간(cluster) 안에서 동시에 떠있던
  // 최대 개수를 그 구간 전체의 열 개수로 통일해, 나중에 겹침이 풀려도 폭이 들쭉날쭉하지 않게 함.
  function agendaTimelineLayout(items) {
    const sorted = [...items].sort((a, b) => a.start_minute - b.start_minute);
    const placements = [];
    let active = []; // { col, end }
    let cluster = [];
    let clusterCols = 0;
    const flushCluster = () => { cluster.forEach(p => { p.colCount = clusterCols; }); cluster = []; clusterCols = 0; };
    sorted.forEach(it => {
      const start = it.start_minute, end = it.start_minute + it.duration_minutes;
      active = active.filter(a => a.end > start);
      if (!active.length && cluster.length) flushCluster();
      const used = new Set(active.map(a => a.col));
      let col = 0;
      while (used.has(col)) col++;
      active.push({ col, end });
      clusterCols = Math.max(clusterCols, active.length);
      const p = { item: it, col, colCount: 1 };
      cluster.push(p);
      placements.push(p);
    });
    if (cluster.length) flushCluster();
    return placements;
  }

  // 오늘 열 타임라인의 습관·일정 항목 드래그(습관탭 attachTimelineItemDrag와 동일 UX, 습관+일정 공용으로 일반화):
  // - 짧게 클릭 → 이름 수정, 0.3초 이상 누르다 움직이면 이동, 끝 8px 구역은 바로 드래그하면 시간(길이) 조절.
  // - 단, 일정은 duration 개념이 없어(시작 시각만 있음) 조절 없이 이동만 지원.
  function attachAgendaTimelineItemDrag(minM) {
    const rowOf = (m) => Math.floor((m - minM) / AG_TL_SLOT_MIN) + 1;

    document.querySelectorAll(".ag-tl-task[data-id]").forEach(task => {
      const id = task.dataset.id;
      const kind = task.dataset.kind;
      const origStart = parseInt(task.dataset.start, 10);
      const origDuration = parseInt(task.dataset.duration, 10);
      const resizable = kind === "habit"; // 일정은 길이 개념이 없어 조절 제외

      let dragKind = null, startY = 0, moved = false, cancelled = false, pressed = false, edgeAtStart = null, isMouse = false;
      let longPressTimer = null;
      let pendingStart = origStart, pendingDuration = origDuration;
      let outsideZone = null, outsideEl = null; // 이동 중 하루종일/다가오는계획/언젠가 쪽 위에 올라갔는지(놓으면 그쪽으로 옮김)

      const zoneAt = (clientY) => {
        if (!resizable) return null;
        const rect = task.getBoundingClientRect();
        const offsetY = clientY - rect.top;
        if (offsetY <= TL_EDGE_ZONE_PX) return "top";
        if (offsetY >= rect.height - TL_EDGE_ZONE_PX) return "bottom";
        return null;
      };
      const applyPreview = () => {
        // 항목이 이제 grid-row가 아니라 절대좌표(top/height)로 배치되므로(겹침 다열 배치 지원) px로 계산
        const sRow = rowOf(pendingStart), eRow = Math.max(sRow + 1, rowOf(pendingStart + pendingDuration));
        task.style.top = `${(sRow - 1) * AG_TL_ROW_PX}px`;
        task.style.height = `${(eRow - sRow) * AG_TL_ROW_PX}px`;
      };
      const clearTimer = () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } };
      const clearHoverHint = () => { task.classList.remove("edge-hover-top", "edge-hover-bottom"); task.style.cursor = ""; };

      const startEditTitle = () => {
        const titleEl = task.querySelector(".ag-tl-title");
        if (!titleEl) return;
        const current = titleEl.textContent;
        const input = document.createElement("input");
        input.type = "text";
        input.className = "inline-add-input";
        input.value = current;
        titleEl.replaceWith(input);
        input.focus(); input.select();
        let done = false;
        const commit = async () => {
          if (done) return;
          const name = input.value.trim();
          if (!name || name === current) { renderAgendaTimed(); return; }
          done = true;
          const table = kind === "habit" ? "tok_habits" : kind === "todo" ? "tok_todos" : "tok_events";
          const field = kind === "habit" ? "name" : "title";
          const { error } = await sb.from(table).update({ [field]: name }).eq("id", id);
          if (error) { alert("수정 실패: " + error.message); done = false; return; }
          await loadAll();
        };
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); commit(); }
          else if (e.key === "Escape") { done = true; renderAgendaTimed(); }
        });
        input.addEventListener("blur", commit);
      };

      task.addEventListener("pointerdown", (e) => {
        if (e.target.closest("input")) return;
        pressed = true;
        moved = false; cancelled = false;
        pendingStart = origStart; pendingDuration = origDuration;
        startY = e.clientY;
        edgeAtStart = zoneAt(e.clientY);
        dragKind = null;
        isMouse = e.pointerType === "mouse";
        task.setPointerCapture?.(e.pointerId);

        // 0.3초 눌러 대기하면(짧은 항목이라 끝부분에서 눌렀어도) 무조건 이동으로 전환.
        // 마우스는 대기 전에 살짝만 움직여도 아래 pointermove에서 바로 판정(끝부분=조절, 몸통=이동)되므로
        // 이 타이머는 "짧은 항목이라 끝부분밖에 못 눌렀는데 이동시키고 싶을 때"의 보완 수단으로 항상 켜둠.
        longPressTimer = setTimeout(() => {
          longPressTimer = null;
          if (cancelled) return;
          dragKind = "move";
          task.classList.add("dragging");
          clearHoverHint();
        }, TL_LONG_PRESS_MS);
      });
      task.addEventListener("pointermove", (e) => {
        if (!pressed) {
          const zone = zoneAt(e.clientY);
          task.classList.toggle("edge-hover-top", zone === "top");
          task.classList.toggle("edge-hover-bottom", zone === "bottom");
          task.style.cursor = zone ? "ns-resize" : "";
          return;
        }
        const dy = e.clientY - startY;
        if (dragKind === null) {
          if (cancelled) return;
          const moveThreshold = isMouse ? 3 : 6;
          if (Math.abs(dy) > moveThreshold) {
            clearTimer();
            if (edgeAtStart) {
              dragKind = edgeAtStart === "top" ? "resize-top" : "resize-bottom";
            } else if (isMouse) {
              dragKind = "move";
              task.classList.add("dragging");
              clearHoverHint();
            } else {
              // 터치 몸통에서 0.3초 되기 전에 움직임 → 스크롤로 보고 취소
              cancelled = true;
              return;
            }
          } else {
            return;
          }
        }
        if (Math.abs(dy) > 6) moved = true;
        if (!moved) return;
        if (dragKind === "move") {
          const el = document.elementFromPoint(e.clientX, e.clientY)?.closest("#agendaAllDayZone, .planup-day, #somedayZone");
          if (el !== outsideEl) {
            outsideEl?.classList.remove("drop-target");
            outsideEl = el || null;
            outsideEl?.classList.add("drop-target");
            outsideZone = el ? homeDropZone(e.clientX, e.clientY) : null;
            task.style.visibility = outsideZone ? "hidden" : "";
          }
          if (outsideZone) return; // 다른 열 위에 있는 동안은 시간 위치 미리보기를 갱신하지 않음
        }
        const deltaMin = Math.round(dy / AG_TL_ROW_PX) * AG_TL_SLOT_MIN;
        if (dragKind === "move") {
          let ns = origStart + deltaMin;
          ns = Math.max(0, Math.min(1440 - origDuration, ns));
          pendingStart = ns; pendingDuration = origDuration;
        } else if (dragKind === "resize-top") {
          let ns = Math.max(0, Math.min(origStart + origDuration - AG_TL_SLOT_MIN, origStart + deltaMin));
          pendingStart = ns; pendingDuration = (origStart + origDuration) - ns;
        } else {
          let nd = Math.max(AG_TL_SLOT_MIN, Math.min(1440 - origStart, origDuration + deltaMin));
          pendingStart = origStart; pendingDuration = nd;
        }
        applyPreview();
      });
      const finish = async () => {
        clearTimer();
        pressed = false;
        const k = dragKind, dropZone = outsideZone;
        dragKind = null; outsideZone = null;
        outsideEl?.classList.remove("drop-target");
        outsideEl = null;
        task.classList.remove("dragging");
        task.style.visibility = "";
        clearHoverHint();

        if (k === null) {
          if (!cancelled) startEditTitle();
          return;
        }
        if (!moved) return;
        if (dropZone) {
          await moveItemToZone(kind, id, dropZone);
          return;
        }
        if (kind === "habit") {
          const { error } = await sb.from("tok_habits").update({
            start_minute: pendingStart, duration_minutes: pendingDuration,
          }).eq("id", id);
          if (error) { alert((k === "move" ? "이동" : "시간 조절") + " 실패: " + error.message); }
        } else if (kind === "todo") {
          const { error } = await sb.from("tok_todos").update({
            todo_time: minutesToHHMM(pendingStart) + ":00",
          }).eq("id", id);
          if (error) { alert("이동 실패: " + error.message); }
        } else {
          const { error } = await sb.from("tok_events").update({
            event_time: minutesToHHMM(pendingStart) + ":00",
          }).eq("id", id);
          if (error) { alert("이동 실패: " + error.message); }
        }
        await loadAll();
      };
      task.addEventListener("pointerup", finish);
      task.addEventListener("pointercancel", () => {
        clearTimer(); pressed = false; dragKind = null; outsideZone = null;
        outsideEl?.classList.remove("drop-target"); outsideEl = null;
        task.classList.remove("dragging"); task.style.visibility = "";
        clearHoverHint();
      });
      task.addEventListener("pointerleave", () => { if (!pressed) clearHoverHint(); });
    });
  }

  function wireAgendaHabitChecks() {
    document.querySelectorAll(".ag-habit-check").forEach(cb => {
      cb.onchange = () => toggleHabitForDate(cb.dataset.id, cb.checked, cb.dataset.date);

    document.querySelectorAll(".ag-todo-check").forEach(cb => {

        const { error } = await sb.from("tok_todos").update({ is_done: cb.checked }).eq("id", cb.dataset.id);
        if (error) { alert("변경 실패: " + error.message); return; }
        const t = todos.find(x => x.id === cb.dataset.id);

        renderPlanUpcomingBoard();

  $("agendaPrevBtn").onclick = () => { homeAgendaDate = addDaysStr(homeAgendaDate, -1); renderAgendaAllDay(); renderAgendaTimed(); };
  $("agendaNextBtn").onclick = () => { homeAgendaDate = addDaysStr(homeAgendaDate, 1); renderAgendaAllDay(); renderAgendaTimed(); };
  $("agendaDateLabel").onclick = () => {

  $("agendaViewTimelineBtn").onclick = () => {

  // "다가오는 계획" 열: 내일부터 7일, 일정+할일+습관을 모두 보여줌.
  // 빈 날짜도 칸이 남아있어 드래그로 그 날짜에 할일을 추가할 수 있음(습관·일정은 표시만 — 드래그 이동은 다음 단계).
  async function renderPlanUpcomingBoard() {
    const days = [];
    for (let i = 1; i <= 7; i++) days.push(addDaysStr(todayStr(), i));
    homePlanDays = days;

    const { data: logData } = await sb.from("tok_habit_logs").select("habit_id, done_date").in("done_date", days);
    const logsByDate = {};
    days.forEach(d => { logsByDate[d] = new Set(); });
    (logData || []).forEach(r => { if (logsByDate[r.done_date]) logsByDate[r.done_date].add(r.habit_id); });

    const active = tasks.filter(t => t.is_active);

    $("planUpcomingBoard").innerHTML = days.map((dateStr, idx) => {
      const dayTodos = todos.filter(td => td.start_date <= dateStr && (td.end_date || td.start_date) >= dateStr);
      const dayEvents = events.filter(e => e.event_date === dateStr).sort((a, b) => (a.event_time || "").localeCompare(b.event_time || ""));
      const doneSet = logsByDate[dateStr];

      const habitHtml = active.map(t => `
        <div class="plan-row habit ${doneSet.has(t.id) ? "done" : ""}">
          <input type="checkbox" ${doneSet.has(t.id) ? "checked" : ""} data-id="${t.id}" data-date="${dateStr}" class="planup-habit-check" />
          <span class="plan-todo-title">${escapeHtml(t.name)}</span>
        </div>`).join("");
      const eventHtml = dayEvents.map(e => `
        <div class="plan-row planup-drag-row" data-id="${e.id}" data-kind="event">
          <span class="plan-todo-title">📅 ${e.event_time ? e.event_time.slice(0, 5) + " " : ""}${escapeHtml(e.title)}</span>
        </div>`).join("");
      const todoHtml = dayTodos.map(td => {
        const isRange = td.end_date && td.end_date !== td.start_date;
        return `<div class="plan-row todo ${isRange ? "" : "planup-drag-row"}" data-id="${td.id}" data-kind="todo">
          <input type="checkbox" ${td.is_done ? "checked" : ""} data-id="${td.id}" class="planup-todo-check" />
          <span class="plan-todo-title planup-todo-title">${td.todo_time ? td.todo_time.slice(0, 5) + " " : ""}${escapeHtml(td.title)}</span>
          ${isRange ? `<span class="plan-range-tag">~${formatDateShort(td.end_date)}</span>` : ""}
          <button class="planup-todo-edit" data-id="${td.id}">✎</button>
        </div>`;
      }).join("");
      const bodyHtml = habitHtml + eventHtml + todoHtml;
      return `<div class="planup-day" data-idx="${idx}" data-date="${dateStr}">
        <div class="planup-day-label">${formatDateShort(dateStr)}</div>
        <div class="planup-day-body">${bodyHtml || '<div class="planup-day-empty">+ 추가</div>'}</div>
      </div>`;
    }).join("");

    document.querySelectorAll(".planup-habit-check").forEach(cb => {
      cb.onchange = () => toggleHabitForDate(cb.dataset.id, cb.checked, cb.dataset.date);
    });
    document.querySelectorAll(".planup-todo-check").forEach(cb => {
      cb.onchange = async () => {
        const { error } = await sb.from("tok_todos").update({ is_done: cb.checked }).eq("id", cb.dataset.id);
        if (error) { alert("변경 실패: " + error.message); return; }
        const t = todos.find(x => x.id === cb.dataset.id);
        if (t) t.is_done = cb.checked;
        renderPlanUpcomingBoard();
      };
    });
    document.querySelectorAll(".planup-todo-edit").forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); openTodoSheet(todos.find(t => t.id === btn.dataset.id)); };
    });
    document.querySelectorAll("#planUpcomingBoard .plan-row.todo .planup-todo-title").forEach(titleEl => {
      titleEl.onclick = (e) => {
        e.stopPropagation();
        const id = titleEl.closest(".plan-row").dataset.id;
        openTodoSheet(todos.find(t => t.id === id));
      };
    });
    document.querySelectorAll("#planUpcomingBoard .plan-row.todo").forEach(row => {
      row.oncontextmenu = (e) => {
        e.preventDefault();
        showDeleteMenu(e.clientX, e.clientY, async () => {
          if (!confirm("이 할일을 삭제할까요?")) return;
          const { error } = await sb.from("tok_todos").delete().eq("id", row.dataset.id);
          if (error) { alert("삭제 실패: " + error.message); return; }
          await loadAll();
        });
      };
    });

    attachPlanUpcomingDrag(days);
    attachPlanUpcomingItemDrag(days);
  }

  // 다가오는 계획 보드: 일정·할일(기간 없는 단일 날짜만) 항목을 다른 날짜 칸/오늘(타임블럭·타임라인·하루종일)/언젠가로 드래그.
  // 습관은 이 보드에 카드가 없어 소스가 될 수 없음. 기간 있는 할일은 애매해서 제외(연필로 직접 수정).
  function attachPlanUpcomingItemDrag(days) {
    const board = $("planUpcomingBoard");
    if (!board) return;

    document.querySelectorAll(".planup-drag-row[data-id]").forEach(row => {
      let moved = false, startX = 0, startY = 0, curTarget = null;
      row.addEventListener("pointerdown", (e) => {
        if (e.target.closest("input") || e.target.closest(".planup-todo-edit")) return;
        e.stopPropagation();
        moved = false; curTarget = null;
        startX = e.clientX; startY = e.clientY;
        row.setPointerCapture?.(e.pointerId);
      });
      row.addEventListener("pointermove", (e) => {
        if (!row.hasPointerCapture?.(e.pointerId)) return;
        e.stopPropagation();
        if (!moved && Math.hypot(e.clientX - startX, e.clientY - startY) > 8) {
          moved = true;
          row.classList.add("dragging");
        }
        if (!moved) return;
        const under = document.elementFromPoint(e.clientX, e.clientY)?.closest(".ag-block-card[data-block-start], .ag-tl-grid, #agendaAllDayZone, #somedayZone, .planup-day[data-idx]");
        if (under !== curTarget) {
          curTarget?.classList.remove("drop-target");
          curTarget = under || null;
          curTarget?.classList.add("drop-target");
        }
      });
      const finish = async (e) => {
        if (!row.hasPointerCapture?.(e.pointerId)) return;
        e.stopPropagation();
        const wasMoved = moved, kind = row.dataset.kind, id = row.dataset.id;
        moved = false;
        row.classList.remove("dragging");
        curTarget?.classList.remove("drop-target");
        curTarget = null;
        if (!wasMoved) return;
        const drop = homeDropZone(e.clientX, e.clientY);
        await moveItemToZone(kind, id, drop);
      };
      row.addEventListener("pointerup", finish);
      row.addEventListener("pointercancel", (e) => {
        e.stopPropagation();
        moved = false;
        row.classList.remove("dragging");
        curTarget?.classList.remove("drop-target");
        curTarget = null;
      });
    });
  }

  let planUpcomingAddState = null;
  function attachPlanUpcomingDrag(days) {
    const board = $("planUpcomingBoard");
    if (!board) return;

    const idxFromPoint = (x, y) => {
      const el = document.elementFromPoint(x, y)?.closest(".planup-day");
      return el ? parseInt(el.dataset.idx, 10) : null;
    };
    const highlight = (a, b) => {
      const lo = Math.min(a, b), hi = Math.max(a, b);
      board.querySelectorAll(".planup-day").forEach(el => {
        const idx = parseInt(el.dataset.idx, 10);
        el.classList.toggle("drag-hi", idx >= lo && idx <= hi);
      });
    };
    const clearHighlight = () => board.querySelectorAll(".planup-day").forEach(el => el.classList.remove("drag-hi"));

    board.onpointerdown = (e) => {
      if (e.target.closest(".planup-todo-check") || e.target.closest(".planup-todo-edit") || e.target.closest(".planup-todo-title") || e.target.closest(".planup-habit-check")) return;
      const dayEl = e.target.closest(".planup-day");
      if (!dayEl) return;
      const startIdx = parseInt(dayEl.dataset.idx, 10);
      planUpcomingAddState = { startIdx, currentIdx: startIdx, moved: false };
      board.setPointerCapture?.(e.pointerId);
      highlight(startIdx, startIdx);
    };
    board.onpointermove = (e) => {
      if (!planUpcomingAddState) return;
      const idx = idxFromPoint(e.clientX, e.clientY);
      if (idx == null) return;
      if (idx !== planUpcomingAddState.startIdx) planUpcomingAddState.moved = true;
      planUpcomingAddState.currentIdx = idx;
      highlight(planUpcomingAddState.startIdx, idx);
    };
    const finish = () => {
      if (!planUpcomingAddState) return;
      const { startIdx, currentIdx, moved } = planUpcomingAddState;
      const lo = Math.min(startIdx, currentIdx), hi = Math.max(startIdx, currentIdx);
      clearHighlight();
      planUpcomingAddState = null;
      const dayEl = board.querySelector(`.planup-day[data-idx="${lo}"]`);
      const body = dayEl?.querySelector(".planup-day-body");
      if (body) showPlanInlineAdd(body, days[lo], moved ? days[hi] : null, renderPlanUpcomingBoard);
    };
    board.onpointerup = finish;
    board.onpointercancel = () => { clearHighlight(); planUpcomingAddState = null; };
  }

  // "언젠가" 열: 요약만(최대 8개). 추가·삭제·이름수정은 '할일' 탭에서. 행 자체는 다른 날짜/오늘로 드래그 가능.
  // ⚠️ data-id 대신 data-someday-id를 씀: 습관 탭의 attachBlockDrag가 전역으로 ".task-row[data-id]"를
  //   찾기 때문에, 여기서 data-id를 그대로 쓰면 이 행에도 그 핸들러가 잘못 붙어버림(이름공간 충돌 방지).
  function renderSomedaySummary() {
    const items = somedayItems.filter(s => !s.is_done).slice(0, 8);
    $("somedaySummaryList").innerHTML = items.map(item => `
      <div class="task-row ag-someday-row" data-someday-id="${item.id}">

        <span>${escapeHtml(item.title)}</span>
      </div>`).join("");

    document.querySelectorAll(".somedaysum-check").forEach(cb => {
      cb.onchange = async () => {
        const { error } = await sb.from("tok_someday").update({ is_done: cb.checked }).eq("id", cb.dataset.id);
        if (error) { alert("변경 실패: " + error.message); return; }
        await loadAll();
      };

    attachSomedayDrag();
